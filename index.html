document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  // إغلاق قائمة "نشاط حديث" لو ضُغط خارجها (سواء الضغطة على عنصر له data-action أو لا) —
  // نحسب el قبل هذا الاستدعاء حتى لا تفقد المرجع بعد إعادة الرسم.
  if(recentActivityOpen && !e.target.closest('.activity-bell-wrap')){ recentActivityOpen = false; render(); }
  if(!el) return;
  const action = el.dataset.action;

  if(action==='auth-submit'){
    const emailEl = document.getElementById('auth-email');
    const passEl = document.getElementById('auth-password');
    const email = (emailEl && emailEl.value || '').trim();
    const password = passEl && passEl.value || '';
    if(!email || !password){ authError = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور.'; render(); return; }
    authError = ''; authBusy = true; render();
    try{ await firebase.auth().signInWithEmailAndPassword(email, password); }
    catch(err){ authError = authErrorMessage(err); }
    authBusy = false; render();
    return;
  }
  if(action==='auth-google'){
    authError = ''; authBusy = true; render();
    try{
      const provider = new firebase.auth.GoogleAuthProvider();
      await firebase.auth().signInWithPopup(provider);
    }catch(err){ authError = authErrorMessage(err); }
    authBusy = false; render();
    return;
  }
  if(action==='sign-out'){
    try{ await firebase.auth().signOut(); }catch(err){ console.error(err); }
    teamPanelOpen = false;
    brandingPanelOpen = false;
    return;
  }
  if(action==='open-team-panel'){ teamPanelOpen = true; teamPanelError=''; render(); return; }
  if(action==='close-team-panel'){ teamPanelOpen = false; render(); return; }
  if(action==='team-add'){
    const emEl = document.getElementById('team-new-email');
    const durEl = document.getElementById('team-new-duration');
    const email = (emEl && emEl.value || '').trim().toLowerCase();
    const durationKey = durEl ? durEl.value : '7';
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ teamPanelError='بريد إلكتروني غير صالح.'; render(); return; }
    teamPanelBusy = true; teamPanelError=''; render();
    try{
      const expiresAt = durationKey==='permanent' ? null : new Date(Date.now() + parseInt(durationKey,10)*86400000);
      await DB.collection('team_members').doc(email).set({
        email, expiresAt, addedBy: currentUser.email, addedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      if(emEl) emEl.value = '';
    }catch(err){ teamPanelError = 'تعذّرت الإضافة: '+(err&&err.message||err); }
    teamPanelBusy = false; render();
    return;
  }
  if(action==='team-remove'){
    const email = el.dataset.email;
    teamPanelBusy = true; render();
    try{ await DB.collection('team_members').doc(email).delete(); }
    catch(err){ teamPanelError = 'تعذّرت الإزالة: '+(err&&err.message||err); }
    teamPanelBusy = false; render();
    return;
  }
  if(action==='toggle-activity-panel'){
    recentActivityOpen = !recentActivityOpen;
    render();
    return;
  }
  if(action==='activity-mark-all-read'){ markAllActivitySeen(); render(); return; }
  if(action==='open-activity-item'){
    markActivitySeen(el.dataset.id);
    recentActivityOpen = false;
    openDetailId = el.dataset.opp;
    render();
    return;
  }
  if(action==='request-notif-permission'){
    if(typeof Notification==='undefined'){ render(); return; }
    try{ notifPermission = await Notification.requestPermission(); }catch(e){ console.error(e); }
    render();
    return;
  }
  if(action==='open-branding-panel'){ brandingPanelOpen = true; brandingError=''; brandingLogoDraft=null; brandingNameDraft=null; render(); return; }
  if(action==='close-branding-panel'){ brandingPanelOpen = false; brandingLogoDraft=null; brandingNameDraft=null; render(); return; }
  if(action==='branding-save'){
    const nameEl = document.getElementById('branding-company-name');
    const companyName = (nameEl && nameEl.value || '').trim();
    const patch = { companyName };
    if(brandingLogoDraft!==null) patch.logoDataUrl = brandingLogoDraft;
    brandingBusy = true; brandingError=''; render();
    try{ await saveBranding(patch); brandingLogoDraft = null; brandingNameDraft = null; }
    catch(err){ brandingError = 'تعذّر الحفظ: '+(err&&err.message||err); }
    brandingBusy = false; render();
    return;
  }
  if(action==='branding-remove-logo'){
    brandingBusy = true; brandingError=''; render();
    try{ await saveBranding({ logoDataUrl: '' }); brandingLogoDraft = null; }
    catch(err){ brandingError = 'تعذّرت الإزالة: '+(err&&err.message||err); }
    brandingBusy = false; render();
    return;
  }
  if(action==='filter-clear'){
    dashFilterCity = 'all'; dashFilterType = 'all';
    render();
    return;
  }

  if(action==='overlay-noop' || action==='close-wizard'){
    if(action==='close-wizard' || e.target.classList.contains('overlay')){
      wizard = null; render();
    }
    return;
  }
  if(action==='cancel-delete'){ if(e.target===el || el.classList.contains('overlay')||el.dataset.action==='cancel-delete'){ confirmDeleteId=null; render(); } return; }

  if(action==='open-wizard'){ wizard = { step:0, draft: blankOpportunity(), editId:null }; render(); return; }
  if(action==='edit-opp'){
    const rec = opportunities.find(o=>o.id===el.dataset.id);
    if(rec && canEditOpp(rec)){ wizard = { step:0, draft: withDefaults(rec.data), editId: rec.id }; openDetailId=null; render(); }
    return;
  }
  if(action==='choose'){
    setPath(wizard.draft, el.dataset.path, el.dataset.value);
    render();
    return;
  }
  if(action==='wizard-next'){
    if(wizard.step < STEPS.length-1){ wizard.step++; render(); }
    return;
  }
  if(action==='wizard-back'){
    if(wizard.step>0){ wizard.step--; render(); }
    return;
  }
  if(action==='wizard-save'){
    const d = wizard.draft;
    const now = todayStr();
    if(!d.meta.createdAt){ d.meta.createdAt = now; d.meta.createdBy = currentUser? currentUser.email : (d.meta.createdBy||null); }
    d.meta.updatedAt = now;
    d.meta.updatedBy = currentUser? currentUser.email : (d.meta.updatedBy||null);
    const id = wizard.editId || uid('OPP');
    await persistOpportunity({ id, data: d });
    await loadAll();
    wizard = null;
    openDetailId = id;
    render();
    return;
  }
  if(action==='open-detail'){
    openDetailId = el.dataset.id; render(); return;
  }
  if(action==='close-detail'){ openDetailId=null; render(); return; }
  if(action==='delete-opp'){
    const rec = opportunities.find(o=>o.id===el.dataset.id);
    if(rec && !canEditOpp(rec)) return;
    confirmDeleteId = el.dataset.id; render(); return;
  }
  if(action==='confirm-delete'){
    await deleteOpportunity(confirmDeleteId);
    if(openDetailId===confirmDeleteId) openDetailId=null;
    confirmDeleteId=null;
    render();
    return;
  }
  if(action==='sort'){
    const key = el.dataset.key;
    if(sortKey===key) sortDir = sortDir==='asc'?'desc':'asc'; else { sortKey=key; sortDir='desc'; }
    render();
    return;
  }
  if(action==='add-condition'){
    wizard.draft.closing.conditions.push({text:'', status:'pending'});
    render();
    return;
  }
  if(action==='remove-condition'){
    const idx = parseInt(el.dataset.idx,10);
    wizard.draft.closing.conditions.splice(idx,1);
    render();
    return;
  }
  if(action==='toggle-compare'){
    const id = el.dataset.id;
    const i = compareIds.indexOf(id);
    if(i>=0) compareIds.splice(i,1);
    else if(compareIds.length<3) compareIds.push(id);
    render();
    return;
  }
  if(action==='open-compare'){
    if(compareIds.length>=2){ compareOpen=true; openDetailId=null; render(); }
    return;
  }
  if(action==='close-compare'){ compareOpen=false; render(); return; }
  if(action==='clear-compare'){ compareIds=[]; render(); return; }
  if(action==='print-memo'){ window.print(); return; }
  if(action==='export-excel'){ exportOpportunityExcel(el.dataset.id); return; }
  if(action==='export-pptx'){ exportOpportunityPptx(el.dataset.id); return; }
});

/* ---------------- Excel / PowerPoint export ---------------- */
function exportOpportunityExcel(id){
  const rec = opportunities.find(o=>o.id===id);
  if(!rec) return;
  const d = withDefaults(rec.data), c = compute(d);
  const yrs = c.projectCF.length;
  try{
    const wb = XLSX.utils.book_new();

    // نبني صفوف الملخص مع تتبّع رقم كل صف، عشان نقدر نكتب معادلات Excel حقيقية (مش أرقام جامدة)
    // للبنود اللي هي نتيجة حسابية مباشرة لبنود أخرى في نفس الجدول (هوية جبرية مضمونة الصحة).
    const summaryRows = [];
    const addRow = (a,b)=>{ summaryRows.push([a,b]); return summaryRows.length; };
    addRow('دفتر الفرص العقارية — مذكرة تقييم فرصة', '');
    addRow('معرّف الفرصة', rec.id);
    addRow('اسم الفرصة', d.meta.name||'');
    addRow('المدينة / الحي / الفئة', `${d.meta.city} · ${d.meta.neighborhood||'—'} · ${d.meta.tier}`);
    addRow('نوع الفرصة', OPP_TYPE_INFO[d.meta.oppType].t);
    addRow('تاريخ آخر تحديث', fmtDateBilingual(d.meta.updatedAt||d.meta.createdAt||todayStr()));
    addRow('تاريخ إصدار هذا التقرير', fmtDateBilingual(todayStr()));
    addRow('', '');
    addRow('المؤشر', 'القيمة');
    addRow('Equity IRR', fmtPct(c.equityIRR,2));
    addRow('Project IRR (Unlevered)', fmtPct(c.projectIRR,2));
    addRow('MOIC', c.MOIC.toFixed(2)+'x');
    addRow('DSCR (أدنى/متوسط)', `${c.dscrMin.toFixed(2)} / ${c.dscrAvg.toFixed(2)}`);
    addRow('Yield on Cost', fmtPct(c.yieldOnCost,2));
    addRow('WACC', fmtPct(c.WACC,2));
    addRow('NAV التقديرية (عند الاستقرار/الخروج)', Math.round(c.NAV||0));
    addRow('ROI (عائد نقدي على مدى العمر)', fmtPct(c.ROI,2));
    addRow('التوصية', c.verdict==='good'?'قابلة للعرض':c.verdict==='warn'?'تحت المراجعة':'دون معايير القبول');
    addRow('', '');
    addRow('البند', 'المبلغ (ريال)');
    const rLand = addRow('قيمة الأرض (Land Cost)', Math.round(c.landCost||0));
    const rHard = addRow('التكلفة الإنشائية (Hard Cost)', Math.round(c.hardCost||0));
    const rTPC  = addRow('إجمالي تكلفة المشروع (TPC)', Math.round(c.TPC||0));
    const rSoft = addRow('رسوم ومصاريف الصندوق (Soft Costs)', 0); // معادلة: TPC - أرض - إنشاء
    const rDebt = addRow('التمويل بالدين (Debt)', Math.round(c.debt||0));
    const rEq   = addRow('حقوق الملكية (Equity)', 0); // معادلة: TPC - Debt
    const rDebtPct = addRow('نسبة الدين من التكلفة (Debt / TPC)', 0); // معادلة
    const rEqPct   = addRow('نسبة حقوق الملكية من التكلفة (Equity / TPC)', 0); // معادلة
    addRow('صافي الدخل التشغيلي (سنة 1 مستقر)', Math.round(c.stabilizedNOIyr1||0));
    addRow('إجمالي التوزيعات', Math.round(c.totalDistrib||0));

    const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
    const setFormula = (row, formula, numFmt)=>{
      const addr = XLSX.utils.encode_cell({ r: row-1, c: 1 });
      wsSummary[addr] = Object.assign({ t:'n', f: formula }, numFmt? { z: numFmt } : {});
    };
    // معادلات حقيقية قابلة لإعادة الحساب في Excel — تتحدّث تلقائياً لو عدّلتِ أي بند مصدري:
    setFormula(rSoft, `B${rTPC}-B${rLand}-B${rHard}`);
    setFormula(rEq, `B${rTPC}-B${rDebt}`);
    setFormula(rDebtPct, `B${rDebt}/B${rTPC}`, '0.0%');
    setFormula(rEqPct, `B${rEq}/B${rTPC}`, '0.0%');
    wsSummary['!cols'] = [{wch:40},{wch:26}];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'الملخص');

    // التدفقات النقدية — مع صفوف معادلات IRR()/XIRR() حقيقية (تحقّق تقاطعي بمعادلات Excel أصلية،
    // بجانب رقم التطبيق الدقيق أعلى). XIRR تستخدم تواريخ فعلية (تاريخ إنشاء الفرصة + سنة لكل صف)
    // فتُعطي نفس منهجية IRR غير المنتظمة الزمنية التي قد يعتمدها التطبيق داخلياً.
    const baseDateStr = d.meta.createdAt || todayStr();
    const baseDate = new Date(baseDateStr+'T00:00:00');
    const cfRows = [['السنة','التاريخ','تدفق المشروع (غير مرفوع)','تدفق حقوق الملكية']];
    for(let i=0;i<yrs;i++){
      const dt = new Date(baseDate); dt.setFullYear(dt.getFullYear()+i);
      cfRows.push([i, dt, Math.round(c.projectCF[i]||0), Math.round(c.equityCF[i]||0)]);
    }
    const wsCF = XLSX.utils.aoa_to_sheet(cfRows);
    const irrRow = cfRows.length + 1, xirrRow = cfRows.length + 2;
    wsCF[XLSX.utils.encode_cell({r:irrRow-1, c:0})] = { t:'s', v:'IRR() — تحقّق Excel (فترات سنوية منتظمة)' };
    wsCF[XLSX.utils.encode_cell({r:irrRow-1, c:2})] = { t:'n', f:`IRR(C2:C${cfRows.length})`, z:'0.0%' };
    wsCF[XLSX.utils.encode_cell({r:irrRow-1, c:3})] = { t:'n', f:`IRR(D2:D${cfRows.length})`, z:'0.0%' };
    wsCF[XLSX.utils.encode_cell({r:xirrRow-1, c:0})] = { t:'s', v:'XIRR() — بالتواريخ الفعلية' };
    wsCF[XLSX.utils.encode_cell({r:xirrRow-1, c:2})] = { t:'n', f:`XIRR(C2:C${cfRows.length},B2:B${cfRows.length})`, z:'0.0%' };
    wsCF[XLSX.utils.encode_cell({r:xirrRow-1, c:3})] = { t:'n', f:`XIRR(D2:D${cfRows.length},B2:B${cfRows.length})`, z:'0.0%' };
    wsCF['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:xirrRow-1, c:3} });
    wsCF['!cols'] = [{wch:8},{wch:14},{wch:24},{wch:24}];
    XLSX.utils.book_append_sheet(wb, wsCF, 'التدفقات النقدية');

    // ورقة المدخلات والافتراضات — كل مدخل رئيسي في مكان واحد، بدل تكراره داخل معادلات متفرقة.
    // نتتبّع أرقام صفوف هيكل حقوق الملكية والمدة عشان نربطها بمعادلات ورقة "شلال التوزيعات" التالية.
    const inputRows = [];
    const addInput = (a,b)=>{ inputRows.push([a,b]); return inputRows.length; };
    addInput('المدخلات والافتراضات الرئيسية', '');
    addInput('البند', 'القيمة');
    addInput('مساحة الأرض (م²)', d.land.area);
    addInput('سعر الأرض (ر.س/م²)', d.land.price);
    addInput('معامل البناء (FAR)', d.land.far);
    addInput('نسبة LTC (تمويل بالدين)', d.financing.ltc);
    addInput('هامش التمويل فوق SAIBOR', d.financing.margin);
    addInput('SAIBOR', d.financing.saibor);
    addInput('مدة التمويل (سنوات)', d.financing.tenor);
    if(d.meta.oppType==='development'){
      addInput('سعر البيع (ر.س/م²)', d.development.salePrice);
      addInput('تكلفة البناء (ر.س/م²)', d.development.buildCost);
      addInput('مدة الإنشاء (سنوات)', d.development.constructionYears);
      addInput('معدل الرسملة عند الخروج (Exit Cap Rate)', d.development.exitCapRate);
    }
    if(d.meta.oppType==='income'){
      addInput('الإيجار (ر.س/م²/سنة)', d.income.rent);
      addInput('نسبة الإشغال', d.income.occupancy);
      addInput('نسبة المصاريف التشغيلية (OPEX)', d.income.opex);
    }
    const rYears = addInput('مدة الصندوق الإجمالية (سنوات)', c.totalYears);
    const rHurdle = addInput('هيكل حقوق الملكية — Hurdle (Pref)', d.economics.hurdle);
    const rCarry = addInput('هيكل حقوق الملكية — Carry', d.economics.carry);
    const rLpShare = addInput('حصة المستثمرين الإضافية من Carry Pool (LP Share)', d.economics.lpShare);
    const rGpShare = addInput('حصة مدير الصندوق من Carry Pool (GP Share)', d.economics.gpShare);
    const rDevShare = addInput('حصة المطور من Carry Pool (Developer Share)', d.economics.devShare);

    const wsInputs = XLSX.utils.aoa_to_sheet(inputRows);
    wsInputs['!cols'] = [{wch:44},{wch:20}];
    XLSX.utils.book_append_sheet(wb, wsInputs, 'المدخلات والافتراضات');

    // شلال التوزيعات — معادلات Excel حية تُعيد بناء نفس منطق الشلال المُستخدَم في التطبيق
    // (ROC → Pref → GP Catch-up → التوزيع المتبقي LP/Carry) خطوة بخطوة، بدل أرقام جامدة.
    const wfRows = [];
    const addWf = (a,b)=>{ wfRows.push([a,b]); return wfRows.length; };
    addWf('شلال التوزيعات — معادلات حية (Distribution Waterfall)', '');
    addWf('البند', 'المبلغ (ريال)');
    const rPIC = addWf('رأس المال المستثمر (PIC = Equity)', 0);
    const rTotDist = addWf('إجمالي التوزيعات (من ورقة التدفقات النقدية)', 0);
    const rROC = addWf('١. عودة رأس المال (ROC)', 0);
    const rRem1 = addWf('المتبقي بعد ROC', 0);
    const rPrefTarget = addWf('مستهدف العائد التفضيلي (Pref Target)', 0);
    const rPref = addWf('٢. العائد التفضيلي (Pref)', 0);
    const rRem2 = addWf('المتبقي بعد Pref', 0);
    const rCatchupTarget = addWf('مستهدف اللحاق (Catch-up Target)', 0);
    const rCatchup = addWf('٣. اللحاق (GP Catch-up)', 0);
    const rRem3 = addWf('المتبقي بعد Catch-up (يُقسَّم LP/Carry)', 0);
    const rLpStd = addWf('نصيب LP القياسي من المتبقي', 0);
    const rCarryPool = addWf('مجمّع الـ Carry', 0);
    const rLpBonus = addWf('↳ حصة المستثمر الإضافية (LP Bonus)', 0);
    const rGpMgr = addWf('↳ حصة مدير الصندوق (GP)', 0);
    const rDevProm = addWf('↳ حصة المطور (Developer Promote)', 0);
    const rLpTotal = addWf('🎯 إجمالي حصة LP (المستثمرين)', 0);
    const rGpTotal = addWf('🎯 إجمالي حصة GP (مدير الصندوق)', 0);
    const rDevTotal = addWf('🎯 إجمالي حصة المطور (Developer Promote)', 0);
    const rCheckSum = addWf('✅ تدقيق: مجموع LP+GP+المطور (لازم يساوي إجمالي التوزيعات)', 0);

    const wsWf = XLSX.utils.aoa_to_sheet(wfRows);
    const setWf = (row, formula, numFmt)=>{
      const addr = XLSX.utils.encode_cell({ r: row-1, c: 1 });
      wsWf[addr] = Object.assign({ t:'n', f: formula }, numFmt? { z: numFmt } : {});
    };
    const IN = (r)=>`'المدخلات والافتراضات'!B${r}`;
    const SUM_REF = `'الملخص'!B${rEq}`;
    const CF_RANGE = `'التدفقات النقدية'!D2:D${cfRows.length}`;
    setWf(rPIC, SUM_REF);
    setWf(rTotDist, `SUMIF(${CF_RANGE},">0")`);
    setWf(rROC, `MIN(B${rPIC},B${rTotDist})`);
    setWf(rRem1, `B${rTotDist}-B${rROC}`);
    setWf(rPrefTarget, `B${rPIC}*(POWER(1+${IN(rHurdle)},${IN(rYears)})-1)`);
    setWf(rPref, `MIN(B${rRem1},MAX(0,B${rPrefTarget}))`);
    setWf(rRem2, `B${rRem1}-B${rPref}`);
    setWf(rCatchupTarget, `IF(B${rRem2}>0,(${IN(rCarry)}/(1-${IN(rCarry)}))*B${rPref},0)`);
    setWf(rCatchup, `MIN(B${rRem2},MAX(0,B${rCatchupTarget}))`);
    setWf(rRem3, `B${rRem2}-B${rCatchup}`);
    setWf(rLpStd, `(1-${IN(rCarry)})*B${rRem3}`);
    setWf(rCarryPool, `${IN(rCarry)}*B${rRem3}`);
    setWf(rLpBonus, `${IN(rLpShare)}*B${rCarryPool}`);
    setWf(rGpMgr, `${IN(rGpShare)}*B${rCarryPool}`);
    setWf(rDevProm, `${IN(rDevShare)}*B${rCarryPool}`);
    setWf(rLpTotal, `B${rROC}+B${rPref}+B${rLpStd}+B${rLpBonus}`);
    setWf(rGpTotal, `B${rCatchup}+B${rGpMgr}`);
    setWf(rDevTotal, `B${rDevProm}`);
    setWf(rCheckSum, `B${rLpTotal}+B${rGpTotal}+B${rDevTotal}-B${rTotDist}`, '#,##0;(#,##0);"-"');
    wsWf['!cols'] = [{wch:44},{wch:20}];
    XLSX.utils.book_append_sheet(wb, wsWf, 'شلال التوزيعات');

    if(d.constructionFinancing){
      const cfin = d.constructionFinancing;
      const wsFin = XLSX.utils.aoa_to_sheet([
        ['التمويل الفعلي — على تكلفة الإنشاء فقط', ''],
        [cfin.note||'', ''],
        [],
        ['البند', 'المبلغ/النسبة'],
        ['إجمالي التكلفة الإنشائية (تسليم مفتاح، شامل عمولة المقاول)', Math.round(cfin.fullConstructionCost||0)],
        ['إجمالي قابل للتمويل (إنشاء + أتعاب مطوّر + رسوم)', Math.round(cfin.totalFundable||0)],
        [`القرض البنكي (${Math.round((cfin.ltcPct||0)*100)}% LTC)`, Math.round(cfin.bankLoan||0)],
        ['النقد المطلوب من المالك/المستثمرين', Math.round(cfin.cashRequiredFromOwnerOrInvestors||0)],
        ['DSCR على تمويل الإنشاء', (cfin.dscr||0).toFixed(2)+'x'],
        ['العائد النقدي السنوي (Cash-on-Cash)', fmtPct(cfin.cashOnCashYieldPct,1)],
        ...(cfin.ownerActualIRR!=null? [['Owner Actual Equity IRR (10 سنوات، بدون بيع)', fmtPct(cfin.ownerActualIRR,1)]]:[]),
        ...(cfin.ownerActualMOIC!=null? [['Owner Actual MOIC', cfin.ownerActualMOIC.toFixed(2)+'x']]:[]),
        ['قيمة الأرض (للعلم فقط، غير مموَّلة)', Math.round(cfin.landValueInformationalOnly||0)],
        [],
        ['المرجع الرسمي للمعادلات الكاملة', cfin.sourceFile||''],
      ]);
      wsFin['!cols'] = [{wch:48},{wch:26}];
      XLSX.utils.book_append_sheet(wb, wsFin, 'التمويل الفعلي');
    }

    XLSX.writeFile(wb, `${rec.id}.xlsx`);
  }catch(e){
    alert('تعذّر تصدير ملف Excel من داخل المتصفح: '+e.message+'\nافتح رابط الأداة مباشرة في تبويب متصفح جديد (وليس داخل نافذة المعاينة) ثم أعد المحاولة.');
  }
}

function exportOpportunityPptx(id){
  const rec = opportunities.find(o=>o.id===id);
  if(!rec) return;
  const d = withDefaults(rec.data), c = compute(d);
  try{
    const Ctor = window.PptxGenJS || (window.pptxgenjs && window.pptxgenjs.default);
    const pres = new Ctor();
    pres.defineLayout({ name:'WIDE', width:13.33, height:7.5 });
    pres.layout = 'WIDE';

    const s1 = pres.addSlide();
    s1.addText(d.meta.name||'فرصة استثمارية', { x:0.5,y:0.5,w:12.3,h:1, fontSize:28, bold:true, color:'0E6B4C', align:'right' });
    s1.addText(`${d.meta.city} · ${d.meta.neighborhood||'—'} · ${d.meta.tier}  |  ${rec.id}`, { x:0.5,y:1.4,w:12.3,h:0.5, fontSize:14, color:'4C5850', align:'right' });
    const vlbl = c.verdict==='good'?'التوصية: قابلة للعرض على لجنة الاستثمار':c.verdict==='warn'?'التوصية: تحت المراجعة':'التوصية: دون معايير القبول';
    s1.addText(vlbl, { x:0.5,y:2.0,w:12.3,h:0.5, fontSize:16, bold:true, color: c.verdict==='good'?'1E8A56':c.verdict==='warn'?'9C6A0A':'AE2E22', align:'right' });

    const kpis = [
      ['Equity IRR', fmtPct(c.equityIRR,2)],
      ['Project IRR', fmtPct(c.projectIRR,2)],
      ['MOIC', c.MOIC.toFixed(2)+'x'],
      ['DSCR', c.dscrMin.toFixed(2)],
      ['Yield on Cost', fmtPct(c.yieldOnCost,2)],
      ['WACC', fmtPct(c.WACC,2)],
    ];
    let kx = 0.5;
    kpis.forEach(([l,v])=>{
      s1.addText([{text:v+'\n',options:{fontSize:20,bold:true,color:'0E6B4C'}},{text:l,options:{fontSize:11,color:'4C5850'}}],
        { x:kx,y:2.8,w:1.95,h:1.1, align:'center', valign:'middle', fill:{color:'F3F4F0'}, line:{color:'D6DACF',width:1} });
      kx += 2.0;
    });

    s1.addText([
      {text:'قيمة الأرض: ', options:{bold:true}}, {text:fmtSAR(c.landCost)+'\n'},
      {text:'التكلفة الإنشائية: ', options:{bold:true}}, {text:fmtSAR(c.hardCost)+'\n'},
      {text:'إجمالي تكلفة المشروع: ', options:{bold:true}}, {text:fmtSAR(c.TPC)+'\n'},
      {text:'صافي الدخل التشغيلي: ', options:{bold:true}}, {text:fmtSAR(c.stabilizedNOIyr1)},
    ], { x:0.5,y:4.2,w:12.3,h:2, fontSize:14, align:'right', color:'152019' });

    const s2 = pres.addSlide();
    s2.addText('التدفقات النقدية السنوية', { x:0.5,y:0.4,w:12.3,h:0.6, fontSize:22, bold:true, color:'0E6B4C', align:'right' });
    const rows = [[
      {text:'تدفق حقوق الملكية', options:{bold:true, fill:{color:'E3EFE7'}}},
      {text:'تدفق المشروع', options:{bold:true, fill:{color:'E3EFE7'}}},
      {text:'السنة', options:{bold:true, fill:{color:'E3EFE7'}}},
    ]];
    for(let i=0;i<c.projectCF.length;i++){
      rows.push([ fmtSAR(c.equityCF[i]), fmtSAR(c.projectCF[i]), String(i) ]);
    }
    s2.addTable(rows, { x:0.5,y:1.1,w:12.3, fontSize:11, autoPage:true, border:{type:'solid',color:'D6DACF',pt:0.5} });

    if(d.constructionFinancing){
      const cfin = d.constructionFinancing;
      const s3 = pres.addSlide();
      s3.addText('التمويل الفعلي — على تكلفة الإنشاء فقط', { x:0.5,y:0.4,w:12.3,h:0.6, fontSize:22, bold:true, color:'0E6B4C', align:'right' });
      s3.addText(cfin.note||'', { x:0.5,y:1.0,w:12.3,h:0.5, fontSize:13, color:'4C5850', align:'right' });
      const finKpis = [
        ['القرض البنكي', fmtSAR(cfin.bankLoan)],
        ['النقد المطلوب من المالك', fmtSAR(cfin.cashRequiredFromOwnerOrInvestors)],
        ['DSCR', (cfin.dscr||0).toFixed(2)+'x'],
        ['عائد نقدي سنوي', fmtPct(cfin.cashOnCashYieldPct,1)],
      ];
      let fx = 0.5;
      finKpis.forEach(([l,v])=>{
        s3.addText([{text:v+'\n',options:{fontSize:20,bold:true,color:'0E6B4C'}},{text:l,options:{fontSize:11,color:'4C5850'}}],
          { x:fx,y:1.7,w:2.95,h:1.1, align:'center', valign:'middle', fill:{color:'F3F4F0'}, line:{color:'D6DACF',width:1} });
        fx += 3.0;
      });
      const finRows = [
        {text:'إجمالي التكلفة الإنشائية (تسليم مفتاح)', options:{bold:true}}, {text:fmtSAR(cfin.fullConstructionCost)+'\n'},
        {text:'إجمالي قابل للتمويل', options:{bold:true}}, {text:fmtSAR(cfin.totalFundable)+'\n'},
      ];
      if(cfin.ownerActualIRR!=null){ finRows.push({text:'Owner Actual Equity IRR (10 سنوات)', options:{bold:true}}, {text:fmtPct(cfin.ownerActualIRR,1)+'\n'}); }
      if(cfin.ownerActualMOIC!=null){ finRows.push({text:'Owner Actual MOIC', options:{bold:true}}, {text:cfin.ownerActualMOIC.toFixed(2)+'x\n'}); }
      finRows.push({text:'قيمة الأرض (للعلم فقط، غير مموَّلة)', options:{bold:true}}, {text:fmtSAR(cfin.landValueInformationalOnly)});
      s3.addText(finRows, { x:0.5,y:3.1,w:12.3,h:3, fontSize:14, align:'right', color:'152019' });
    }

    pres.writeFile({ fileName: `${rec.id}.pptx` });
  }catch(e){
    alert('تعذّر تصدير ملف PowerPoint من داخل المتصفح: '+e.message+'\nافتح رابط الأداة مباشرة في تبويب متصفح جديد (وليس داخل نافذة المعاينة) ثم أعد المحاولة.');
  }
}

document.addEventListener('input', (e)=>{
  if(!wizard) return;
  const t = e.target;
  if(!t.name) return;
  if(!t.closest('#wizard-modal')) return;
  let val;
  if(t.dataset.pct){ val = parseFloat(t.value); val = isFinite(val)? val/100 : 0; }
  else if(t.type==='number'){ val = parseFloat(t.value); if(!isFinite(val)) val=0; }
  else if(t.dataset.int){ val = parseInt(t.value,10)||0; }
  else if(t.dataset.bool){ val = t.value==='true'; }
  else val = t.value;
  setPath(wizard.draft, t.name, val);
  updateLivePreview();
});
document.addEventListener('change', (e)=>{
  const t = e.target;
  if(t.dataset && t.dataset.action==='filter-city'){ dashFilterCity = t.value; render(); return; }
  if(t.dataset && t.dataset.action==='filter-type'){ dashFilterType = t.value; render(); return; }
  if(t.dataset && t.dataset.action==='branding-logo-file'){
    const nameEl = document.getElementById('branding-company-name');
    if(nameEl) brandingNameDraft = nameEl.value; // نحافظ على أي اسم مكتوب لسه ما اتحفظش قبل إعادة الرسم
    const file = t.files && t.files[0];
    if(!file) return;
    if(file.size > 800*1024){ brandingError = 'حجم الصورة كبير جداً (الحد المفضّل أقل من 300KB، والأقصى 800KB) — رجاءً اختاري صورة أصغر.'; render(); return; }
    const reader = new FileReader();
    reader.onload = ()=>{ brandingLogoDraft = reader.result; brandingError=''; render(); };
    reader.onerror = ()=>{ brandingError = 'تعذّرت قراءة الصورة.'; render(); };
    reader.readAsDataURL(file);
    return;
  }
  if(!wizard || !t.name) return;
  if(!t.closest('#wizard-modal')) return;
  if(t.tagName==='SELECT'){
    let val;
    if(t.dataset.int) val = parseInt(t.value,10)||0;
    else if(t.dataset.bool) val = t.value==='true';
    else val = t.value;
    setPath(wizard.draft, t.name, val);
    if(t.dataset.rerender) render(); else updateLivePreview();
  }
});

initDb();
</script>
