<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الفرص العقارية — Opal</title>
<meta name="description" content="دفتر الفرص العقارية — أداة تقييم وتحليل جدوى الفرص الاستثمارية العقارية من شركة أوبال القابضة (Opal Holding)">
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F3F4F0; --surface:#FFFFFF; --surface-2:#EAEDE7; --surface-3:#E0E4DC;
  --ink:#152019; --ink-soft:#4C5850; --ink-faint:#7C877E; --border:#D6DACF;
  --accent:#0E6B4C; --accent-ink:#FFFFFF; --accent-soft:#E3EFE7; --accent-soft-ink:#0E5A3F;
  --gold:#9C7B2E; --gold-soft:#F1E9D4;
  --good:#1E8A56; --good-soft:#DFF1E6;
  --warn:#9C6A0A; --warn-soft:#F6EAD2;
  --bad:#AE2E22; --bad-soft:#F7E0DC;
  --shadow: 0 1px 2px rgba(20,28,22,.06), 0 8px 24px -12px rgba(20,28,22,.18);
  --radius: 12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10150F; --surface:#171E17; --surface-2:#1D251C; --surface-3:#252E23;
    --ink:#E7ECE5; --ink-soft:#A7B3A6; --ink-faint:#748174; --border:#2B342A;
    --accent:#49C388; --accent-ink:#08170F; --accent-soft:#17281F; --accent-soft-ink:#6FDBA4;
    --gold:#D8B563; --gold-soft:#2A2413;
    --good:#4FC988; --good-soft:#173125;
    --warn:#E3B25B; --warn-soft:#2E2611;
    --bad:#E38176; --bad-soft:#301917;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#10150F; --surface:#171E17; --surface-2:#1D251C; --surface-3:#252E23;
  --ink:#E7ECE5; --ink-soft:#A7B3A6; --ink-faint:#748174; --border:#2B342A;
  --accent:#49C388; --accent-ink:#08170F; --accent-soft:#17281F; --accent-soft-ink:#6FDBA4;
  --gold:#D8B563; --gold-soft:#2A2413;
  --good:#4FC988; --good-soft:#173125;
  --warn:#E3B25B; --warn-soft:#2E2611;
  --bad:#E38176; --bad-soft:#301917;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Sakkal Majalla','Arial','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  font-size:15.5px; line-height:1.65;
}
h1,h2,h3,.display{ font-family:'Sakkal Majalla','Amiri','IBM Plex Sans Arabic',serif; }
.num, .ltr{ direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; }
.mono{ font-family:'IBM Plex Mono',monospace; }
::selection{ background:var(--accent-soft); color:var(--accent-soft-ink); }
a{color:var(--accent);}
button{font-family:inherit;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- shell ---------- */
.app{ max-width:1280px; margin:0 auto; padding:20px 20px 64px; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 20px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px;
}
.brand{ display:flex; align-items:center; gap:12px; }
.brand .mark{
  width:42px;height:42px;border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-weight:700;font-size:19px;
  font-family:'Amiri',serif; flex:none; overflow:hidden; padding:4px; box-shadow:inset 0 0 0 1px var(--border);
}
.brand .mark img{ width:100%; height:100%; object-fit:contain; }
.opal-footer{
  margin-top:28px; padding:18px 20px; text-align:center; color:var(--ink-faint); font-size:11.5px;
  border-top:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:8px;
}
.opal-footer img{ height:34px; width:auto; opacity:.92; }
.opal-footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
.opal-footer a:hover{ text-decoration:underline; }
.brand h1{ font-size:19px; margin:0; font-weight:700; }
.brand .sub{ font-size:11.5px; color:var(--ink-faint); direction:ltr; text-align:right; letter-spacing:.02em; }
.btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:filter .12s, transform .08s;
}
.btn:hover{ filter:brightness(0.97); }
.btn:active{ transform:scale(.98); }
.btn:focus-visible, .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible, a:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-danger{ background:var(--bad-soft); border-color:var(--bad-soft); color:var(--bad); }
.btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:7px; }

/* ---------- KPI strip ---------- */
.kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px; }
.kpi{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease; }
.kpi:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(20,28,22,.10), 0 14px 30px -14px rgba(20,28,22,.24); }
.kpi .l{ font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:6px; }
.kpi .v{ font-size:22px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:right; }
.kpi .v small{ font-size:12px; color:var(--ink-faint); font-weight:500; font-family:'IBM Plex Sans Arabic'; }

/* ---------- شريط أهم مؤشرات لوحة القيادة (أول ما يُرى) ---------- */
.dash-hero{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
.dash-hero-card{
  position:relative; overflow:hidden; border-radius:var(--radius); padding:16px 18px 14px;
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
}
.dash-hero-card:hover{ transform:translateY(-3px); box-shadow:0 6px 14px rgba(20,28,22,.12), 0 18px 34px -16px rgba(20,28,22,.28); }
.dash-hero-card::before{ content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--accent-color, var(--accent)); }
.dash-hero-card .icon{ font-size:18px; margin-bottom:8px; display:block; }
.dash-hero-card .l{ font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:6px; }
.dash-hero-card .v{ font-size:24px; font-weight:800; font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:right; color:var(--ink); }
.dash-hero-card .v small{ font-size:13px; color:var(--ink-faint); font-weight:500; font-family:'IBM Plex Sans Arabic'; }
.dash-hero-card .sub{ font-size:10.5px; color:var(--ink-faint); margin-top:4px; }

/* ---------- عناوين أقسام لوحة القيادة (تجميع منطقي للمؤشرات) ---------- */
.dash-section{ margin-bottom:16px; }
.dash-section-title{
  display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--ink-soft);
  margin-bottom:8px; padding-right:2px; letter-spacing:.01em;
}
.dash-section-title .bar{ width:3px; height:14px; border-radius:2px; background:var(--accent); display:inline-block; }

@media (max-width: 900px){
  .dash-hero{ grid-template-columns:repeat(2,1fr); }
  .kpis{ grid-template-columns:repeat(2,1fr); }
}

/* ---------- table / database grid ---------- */
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.chart-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
.panel-head h2{ font-size:15.5px; margin:0; }
.tablewrap{ overflow-x:auto; }
table.db{ width:100%; border-collapse:collapse; min-width:920px; }
table.db th{ text-align:right; font-size:11.5px; color:var(--ink-faint); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none; }
table.db th:hover{ color:var(--ink); }
table.db td{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:13.5px; white-space:nowrap; }
table.db tbody tr{ cursor:pointer; transition:background .1s; }
table.db tbody tr:hover{ background:var(--surface-2); }
table.db tbody tr:last-child td{ border-bottom:none; }
.tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
.tag-income{ background:var(--accent-soft); color:var(--accent-soft-ink); }
.tag-dev{ background:var(--gold-soft); color:var(--gold); }
.tag-land{ background:var(--surface-3); color:var(--ink-soft); }
.dot{ width:9px;height:9px;border-radius:50%; display:inline-block; }
.verdict-good{ background:var(--good-soft); color:var(--good); }
.verdict-warn{ background:var(--warn-soft); color:var(--warn); }
.verdict-bad{ background:var(--bad-soft); color:var(--bad); }
.empty{ padding:64px 20px; text-align:center; color:var(--ink-faint); }
.empty .display{ font-size:20px; color:var(--ink); margin-bottom:6px; }

/* ---------- modal / wizard ---------- */
.overlay{ position:fixed; inset:0; background:rgba(10,14,10,.5); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
.modal{ background:var(--surface); border-radius:16px; width:100%; max-width:880px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 24px 64px -20px rgba(0,0,0,.4); border:1px solid var(--border); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
.modal-head .steps{ font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono'; direction:ltr; }
.progress{ height:4px; background:var(--surface-3); }
.progress i{ display:block; height:100%; background:var(--accent); transition:width .25s; }
.modal-body{ padding:24px 26px; overflow-y:auto; flex:1; }
.modal-foot{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-top:1px solid var(--border); gap:10px; }
.step-title{ font-size:17px; font-weight:700; margin:0 0 3px; }
.step-sub{ font-size:12.5px; color:var(--ink-faint); margin:0 0 20px; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
@media (max-width:720px){ .grid2,.grid3{ grid-template-columns:1fr; } .kpis{grid-template-columns:1fr 1fr;} }

.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:2px; }
.field.span2{ grid-column:1 / -1; }
.field label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:flex; justify-content:space-between; gap:8px; }
.field label .en{ direction:ltr; color:var(--ink-faint); font-weight:500; font-size:11px; }
.field input, .field select, .field textarea{
  border:1px solid var(--border); background:var(--paper); color:var(--ink); border-radius:8px;
  padding:9px 11px; font-size:13.5px; font-family:inherit; width:100%;
}
.field input[type=number]{ direction:ltr; text-align:left; font-family:'IBM Plex Mono'; }
.field .hint{ font-size:11px; color:var(--ink-faint); }
.field textarea{ resize:vertical; min-height:64px; font-family:inherit; }
.suffix-wrap{ position:relative; }
.suffix-wrap .suffix{ position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:11.5px; color:var(--ink-faint); pointer-events:none; }
.suffix-wrap input{ padding-left:44px; }

.chooser{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.chooser .opt{ border:1.5px solid var(--border); border-radius:11px; padding:14px; cursor:pointer; text-align:center; transition:border-color .1s, background .1s; }
.chooser .opt:hover{ border-color:var(--accent); }
.chooser .opt.sel{ border-color:var(--accent); background:var(--accent-soft); }
.chooser .opt .ic{ font-size:22px; margin-bottom:6px; }
.chooser .opt .t{ font-weight:700; font-size:13.5px; }
.chooser .opt .d{ font-size:11px; color:var(--ink-faint); margin-top:3px; }

.livebox{ margin-top:20px; border:1px dashed var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2); }
.livebox .lt{ font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:8px; }
.livebox .lg{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.livebox .li{ font-size:11.5px; }
.livebox .li b{ display:block; font-size:14px; font-family:'IBM Plex Mono'; direction:ltr; text-align:right; }

/* ---------- detail / memo view ---------- */
.memo{ display:flex; flex-direction:column; gap:16px; }
.memo-hero{ background:linear-gradient(160deg,var(--surface-2),var(--surface)); border:1px solid var(--border); border-radius:16px; padding:24px 26px; }
.memo-hero .eyebrow{ font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.03em; }
.memo-hero h2{ font-size:24px; margin:6px 0 4px; }
.memo-hero .meta{ font-size:12.5px; color:var(--ink-faint); display:flex; gap:14px; flex-wrap:wrap; }
.verdict-banner{ margin-top:16px; border-radius:10px; padding:13px 16px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px; }
.section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
.section h3{ font-size:14.5px; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
.section h3 .n{ background:var(--accent-soft); color:var(--accent-soft-ink); width:22px;height:22px;border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-family:'IBM Plex Mono'; }
.kv{ display:grid; grid-template-columns:1fr auto; gap:8px 16px; font-size:13px; }
.kv .k{ color:var(--ink-soft); }
.kv .v{ font-family:'IBM Plex Mono'; direction:ltr; text-align:right; font-weight:600; }
table.report{ width:100%; border-collapse:collapse; font-size:13px; }
table.report th{ text-align:right; font-size:11px; color:var(--ink-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); }
table.report td{ padding:9px 10px; border-bottom:1px solid var(--border); }
table.report td.num{ font-family:'IBM Plex Mono'; }
table.report tr:last-child td{ border-bottom:none; }
.pill{ padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; }
.grid-2col{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
@media (max-width:900px){ .grid-2col{ grid-template-columns:1fr; } }
.bars{ display:flex; flex-direction:column; gap:10px; }
.barrow .lbl{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px; }
.barrow .track{ height:9px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
.barrow .fill{ height:100%; border-radius:5px; }
.note{ font-size:11.5px; color:var(--ink-faint); line-height:1.7; }
.badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
.small-btns{ display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- جرس النشاط الحديث (فرص أضافها الزملاء) ---------- */
.activity-bell-wrap{ position:relative; display:inline-block; }
.activity-bell-btn{ position:relative; }
.activity-badge{
  position:absolute; top:-6px; left:-6px; background:var(--bad); color:#fff; font-size:10px; font-weight:700;
  min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;
}
.activity-dropdown{
  position:absolute; top:calc(100% + 8px); left:0; width:320px; max-height:380px; overflow-y:auto;
  background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.22);
  z-index:60; padding:10px;
}
.activity-item{ display:flex; flex-direction:column; gap:2px; padding:8px 9px; border-radius:8px; cursor:pointer; }
.activity-item:hover{ background:var(--surface-2); }
.activity-item.unseen{ background:var(--gold-soft, var(--surface-2)); }
.activity-item .t{ font-size:12.5px; font-weight:600; }
.activity-item .m{ font-size:11px; color:var(--ink-faint); }

/* ---------- closing conditions list ---------- */
.cond-list{ display:flex; flex-direction:column; gap:8px; }
.cond-row{ display:flex; gap:8px; align-items:center; }
.cond-row input[type=text]{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; direction:rtl; unicode-bidi:plaintext; }
.cond-row select{ min-width:150px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:12.5px; }
table.db thead th:first-child, table.db tbody td:first-child{ width:32px; text-align:center; }

/* ---------- print / PDF export (letterhead-style report) ---------- */
@page{ margin: 20mm 16mm 18mm; }
/* غلاف/ترويسة الطباعة (شعار الشركة + اسمها) — عنصر DOM حقيقي، مخفي على الشاشة، يظهر فقط عند الطباعة */
.print-letterhead{ display:none; }
@media print{
  .topbar, .kpis.portfolio, .dash-hero, .dash-section, .panel, .badge-row, .small-btns, .overlay, .db-toolbar{ display:none !important; }
  html,body{ background:#fff; color:#111; font-family:'Sakkal Majalla','Amiri','Times New Roman','Arial',serif; font-size:12.5px; }
  .app{ padding:0; max-width:none; }
  .memo{ gap:0; }
  /* أرقام/نصوص إنجليزية داخل التقرير المطبوع تبقى بخط لاتيني احترافي واضح، بدل الاعتماد على خط عربي لعرض أرقام */
  .mono, .ltr, table.report td.num, .kv .v[dir=ltr]{ font-family:'Times New Roman','IBM Plex Mono',monospace !important; }

  /* letterhead (شعار + اسم الشركة، عنصر DOM حتى تُعرض صورة الشعار فعلياً) */
  .print-letterhead{
    display:flex; align-items:center; justify-content:center; gap:12px;
    border-bottom:2.5px solid #0E6B4C; padding-bottom:10px; margin-bottom:14px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .print-letterhead-logo{ height:38px; max-width:120px; object-fit:contain; }
  .print-letterhead-text{ text-align:center; }
  .print-letterhead-company{ font-size:13px; font-weight:700; color:#0B2D1E; margin-bottom:2px; }
  .print-letterhead-app{ font-family:'Sakkal Majalla','Amiri',serif; font-size:11px; letter-spacing:.06em; color:#0E6B4C; font-weight:700; }
  .print-letterhead-date{ font-size:9.5px; color:#4B5B52; margin-top:2px; }

  .memo-hero{
    border:none; border-bottom:1.5px solid #0E6B4C; background:none;
    border-radius:0; padding:0 0 14px; margin-bottom:16px; break-after:avoid;
  }
  .memo-hero h2{ font-size:22px; margin:8px 0 6px; color:#0B2D1E; }
  .memo-hero .eyebrow{ color:#0E6B4C; }
  .verdict-banner{ -webkit-print-color-adjust:exact; print-color-adjust:exact; border:1px solid rgba(0,0,0,.15) !important; }

  .section{
    border:1px solid #D9DED6; border-radius:8px; break-inside:avoid; margin-bottom:12px;
    box-shadow:none;
  }
  .section h3{ background:#F2F5F0; -webkit-print-color-adjust:exact; print-color-adjust:exact; border-radius:8px 8px 0 0; }
  .kpis{ break-inside:avoid; }
  .kpi{ border:1px solid #E3E6DE; }
  table.report, table.db{ break-inside:auto; }
  table.report tr, table.db tr{ break-inside:avoid; }
  canvas{ break-inside:avoid; max-height:220px !important; }

  /* footer disclaimer */
  .memo::after{
    content: "تم إنشاء هذا التقرير عبر دفتر الفرص العقارية — أرقام تقديرية لأغراض دراسة الجدوى الأولية وليست عرضاً ملزماً.";
    display:block; text-align:center; font-size:9.5px; color:#7C877E; margin-top:18px;
    border-top:1px solid #D9DED6; padding-top:8px;
  }
  a[href]:after{ content:""; }
}
</style>
</head>
<body>

<div class="app" id="app"></div>

// أكثر من بريد أدمن مسموح — كلاهما بصلاحية كاملة دائمة (حساب Firebase وحساب GitHub منفصلين لنفس المالكة).
// لازم يطابق تماماً قائمة isAdminEmail() في firestore.rules.
const ADMIN_EMAILS = ['opal3k@gmail.com', 'ggocss@gmail.com'];
const ADMIN_EMAIL = ADMIN_EMAILS[0]; // للتوافق مع النصوص القديمة التي تعرض بريد أدمن واحد فقط
function isAdmin(user){ return !!user && !!user.email && ADMIN_EMAILS.includes(user.email.toLowerCase()); }
// أعضاء الفريق (غير الأدمن) يقدروا يعدّلوا/يحذفوا بس الفرص اللي هم نفسهم أضافوها — الأدمن يقدر على كل شيء،
// وأي فرصة قديمة بدون بيانات "أضافها" (من قبل تفعيل هذا القيد) تبقى قابلة للتعديل من الجميع.
function canEditOpp(rec){
  if(!DB) return true;
  if(isAdmin(currentUser)) return true;
  const owner = rec && rec.data && rec.data.meta && rec.data.meta.createdBy;
  if(!owner) return true;
  return !!currentUser && !!currentUser.email && owner.toLowerCase()===currentUser.email.toLowerCase();
}

function updateDocMeta(){

    document.title = LANG==='en' ? 'Real Estate Opportunity Ledger — Opal' : 'دفتر الفرص العقارية — Opal';
    const metaDesc = document.querySelector('meta[name="description"]');
    if(metaDesc) metaDesc.setAttribute('content', LANG==='en'
      ? 'Real Estate Opportunity Ledger — a real-estate investment underwriting and feasibility tool by Opal'
      : 'دفتر الفرص العقارية — أداة تقييم وتحليل جدوى الفرص الاستثمارية العقارية من شركة أوبال القابضة (Opal Holding)');
  }catch(e){}
}

  LANG = (l==='en')? 'en' : 'ar';
  try{ localStorage.setItem('reop_lang', LANG); }catch(e){}
  document.documentElement.lang = LANG;
  updateDocMeta();
  render();
}
function toggleLang(){ setLang(LANG==='en'?'ar':'en'); }
updateDocMeta();

function subscribeOpportunities(){
  if(unsubscribeOpportunities) return; // متصلة بالفعل
  oppSnapshotInitialized = false; // أول لقطة قادمة = الحالة الحالية (baseline)، مش "جديد"
  // مزامنة لحظية: أي تعديل يُحفظ في Firestore (من جهازك أو من زميل آخر) يظهر فوراً هنا بدون إعادة تحميل الصفحة.
  unsubscribeOpportunities = DB.collection('opportunities').onSnapshot(snap => {
    accessDenied = false;
    opportunities = snap.docs.map(d => ({ id: d.id, data: d.data() }));
    if(oppSnapshotInitialized){
      snap.docChanges().forEach(ch=>{
        if(ch.type!=='added') return;
        const data = ch.doc.data();
        const addedBy = data && data.meta && data.meta.createdBy;
        // نبلّغ فقط عن فرص أضافها زميل آخر (مش أنا) — حتى ما تتكرر إشعارات على إضافاتي أنا نفسي.
        if(addedBy && currentUser && currentUser.email && addedBy.toLowerCase()!==currentUser.email.toLowerCase()){
          pushRecentActivity({ oppId: ch.doc.id, name: (data.meta&&data.meta.name)||'فرصة بدون اسم', by: addedBy, at: Date.now() });
        }
      });
    } else {
      oppSnapshotInitialized = true;
    }
    render();
  }, err => {
    console.error('Firestore sync error:', err);
    if(err && err.code==='permission-denied'){
      accessDenied = true;
      if(unsubscribeOpportunities){ unsubscribeOpportunities(); unsubscribeOpportunities=null; }
      render();
    }
  });
}

/* ---------------- نشاط حديث / تنبيهات "فرصة جديدة أضافها زميل" ---------------- */
function pushRecentActivity(entry){
  recentActivity.unshift({ id: entry.oppId+'-'+entry.at, oppId: entry.oppId, name: entry.name, by: entry.by, at: entry.at, seen:false });
  if(recentActivity.length>30) recentActivity.length = 30;
  notifyBrowser(entry);
  render();
}
function unreadActivityCount(){ return recentActivity.filter(a=>!a.seen).length; }
function notifyBrowser(entry){
  try{
    if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
    const n = new Notification('🏢 فرصة استثمارية جديدة', {
      body: `${entry.name} — أضافها ${entry.by}`,
      tag: 'reop-'+entry.oppId,
    });
    n.onclick = ()=>{ try{ window.focus(); }catch(e){} openDetailId = entry.oppId; recentActivityOpen=false; markActivitySeen(entry.oppId+'-'+entry.at); render(); };
  }catch(e){ console.error('Browser notification error:', e); }
}
function markActivitySeen(id){ const a = recentActivity.find(x=>x.id===id); if(a) a.seen = true; }
function markAllActivitySeen(){ recentActivity.forEach(a=> a.seen=true); }
function timeAgo(ts){
  const s = Math.max(0, Math.floor((Date.now()-ts)/1000));
  if(s<60) return 'الآن';
  const m = Math.floor(s/60); if(m<60) return `منذ ${m} د`;
  const h = Math.floor(m/60); if(h<24) return `منذ ${h} س`;
  const d = Math.floor(h/24); return `منذ ${d} يوم`;
}

/* ---------------- "من متصل الآن" — تحديث نبضة حضور كل ٢٥ ثانية + متابعة حضور الجميع ---------------- */
function startPresence(){
  if(!DB || !currentUser) return;
  const ref = DB.collection('presence').doc(currentUser.uid);
  const beat = () => ref.set({ email: currentUser.email, lastSeen: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true }).catch(()=>{});
  beat();
  if(presenceHeartbeatTimer) clearInterval(presenceHeartbeatTimer);
  presenceHeartbeatTimer = setInterval(beat, 25000);
  if(!unsubscribePresence){
    unsubscribePresence = DB.collection('presence').onSnapshot(snap => {
      const now = Date.now();
      onlineUsers = snap.docs.map(d=>d.data())
        .filter(u => u.lastSeen && (now - u.lastSeen.toMillis()) < 90000)
        .sort((a,b)=> (a.email||'').localeCompare(b.email||''));
      render();
    }, err => { console.error('Presence sync error:', err); });
  }
}
function stopPresence(){
  if(presenceHeartbeatTimer){ clearInterval(presenceHeartbeatTimer); presenceHeartbeatTimer=null; }
  if(unsubscribePresence){ unsubscribePresence(); unsubscribePresence=null; }
  onlineUsers = [];
}

function uid(prefix){ return prefix+'-'+Math.random().toString(36).slice(2,8).toUpperCase(); }
function getPath(obj,path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj,path,val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++){ if(o[parts[i]]==null) o[parts[i]]={}; o = o[parts[i]]; }
  o[parts[parts.length-1]] = val;
}
function n(v,d){ v = parseFloat(v); return isFinite(v)? v : (d==null?0:d); }
function fmtSAR(v){
  if(v==null || !isFinite(v)) return '—';
  const sign = v<0? '-':''; v = Math.abs(v);
  let s;
  if(v>=1e6) s = (v/1e6).toFixed(2)+'M';
  else if(v>=1e3) s = Math.round(v).toLocaleString('en-US');
  else s = v.toFixed(0);
  return sign+s+' '+T('ر.س','SAR');
}
function fmtNum(v,dec){ if(v==null||!isFinite(v)) return '—'; return v.toLocaleString('en-US',{maximumFractionDigits:dec==null?0:dec, minimumFractionDigits:dec==null?0:dec}); }
function fmtPct(v,dec){ if(v==null||!isFinite(v)) return '—'; return (v*100).toFixed(dec==null?1:dec)+'%'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtHijri(dateStr){
  try{
    const dt = new Date((dateStr||'')+'T00:00:00');
    if(isNaN(dt.getTime())) return '';
    return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { year:'numeric', month:'2-digit', day:'2-digit' }).format(dt);
  }catch(e){ return ''; }
}

/* =========================================================================
   محرك الحسابات — Underwriting / Feasibility engine
   ========================================================================= */
function irr(cashflows){
  // Newton's method with bisection fallback. cashflows[0] is year 0.
  function npv(r){ let s=0; for(let t=0;t<cashflows.length;t++) s += cashflows[t]/Math.pow(1+r,t); return s; }
  let r = 0.15;
  for(let i=0;i<60;i++){
    const f = npv(r);
    const df = (npv(r+1e-5)-f)/1e-5;
    if(Math.abs(df)<1e-9) break;
    const rn = r - f/df;
    if(!isFinite(rn)) break;
    if(Math.abs(rn-r)<1e-7){ r=rn; break; }
    r = rn;
  }
  if(isFinite(r) && Math.abs(npv(r))<1) return r;
  // bisection fallback over a wide range
  let lo=-0.95, hi=5, flo=npv(lo), fhi=npv(hi);
  if(flo*fhi>0) return NaN;
  for(let i=0;i<200;i++){
    const mid=(lo+hi)/2, fm=npv(mid);
    if(Math.abs(fm)<1) return mid;
    if(flo*fm<0){ hi=mid; fhi=fm; } else { lo=mid; flo=fm; }
  }
  return (lo+hi)/2;
}
function npvAt(rate, cashflows){ let s=0; for(let t=0;t<cashflows.length;t++) s+=cashflows[t]/Math.pow(1+rate,t); return s; }

/* Backward-compatible defaults merge: fills any field missing from an older
   saved record (or a partially-built draft) with blankOpportunity()'s defaults,
   without touching anything the record already has. */
function withDefaults(o){
  const b = blankOpportunity();
  function merge(dst, src){
    for(const k in src){
      const sv = src[k];
      if(sv && typeof sv==='object' && !Array.isArray(sv)){
        if(dst[k]==null || typeof dst[k]!=='object' || Array.isArray(dst[k])) dst[k] = {};
        merge(dst[k], sv);
      } else if(dst[k]===undefined){
        dst[k] = sv;
      }
    }
    return dst;
  }
  return merge(JSON.parse(JSON.stringify(o||{})), b);
}

function compute(o, scenarioKey){
  o = withDefaults(o);
  const scn = (scenarioKey && scenarioKey!=='base' && o.scenarios && o.scenarios[scenarioKey]) ? o.scenarios[scenarioKey] : null;
  const rentMult = scn? scn.rentMult : 1;
  const salePriceMult = scn? scn.salePriceMult : 1;
  const costMult = scn? scn.costMult : 1;
  const capRateDelta = scn? scn.capRateDelta : 0;
  const rateDelta = scn? scn.rateDelta : 0;

  const land = o.land, site = o.site, strat = o.strategy, meta = o.meta;
  const tierMult = TIERS[meta.tier] ?? 1.0;
  const useInfo = USE_TYPES[meta.useType] || {mult:1,niy:0.07};
  const siteFactor = [site.soil,site.water,site.tower,site.topo,site.infra].reduce((prod,idx,i)=>{
    const keys=['soil','water','tower','topo','infra'];
    const opt = SITE_FACTORS[keys[i]][idx||0];
    return prod * opt[1];
  },1);

  const landCost = land.area * land.price;
  const gfa = land.area * land.far;
  const footprint = land.area * land.bar;
  const floorsNeeded = footprint>0? Math.ceil(gfa/footprint) : 0;
  const buildingHeight = floorsNeeded * land.floorHeight;
  const landCostPerGFA = gfa>0? landCost/gfa : 0;
  const masterMultiplier = tierMult * useInfo.mult * siteFactor;

  const type = meta.oppType; // income | development | landbank
  const assetClass = type==='income' ? (o.income.assetClass||'عام') : 'عام';
  const holdStrategy = type==='income' ? (o.income.holdStrategy||'exit_sale') : 'exit_sale';
  const refi = Object.assign({intervalYears:5, refiLtv:0.65, refiCostPct:0.01, analysisHorizon:10}, o.income.refinance||{});
  const scopeType = (type==='development'||type==='income') ? (o.development.scopeType||'both') : 'both';
  const infraCostPerSqm = o.development.infraCostPerSqm || 0;

  let hardCostBase = 0, hardCost = 0, salePct = strat.salePct;
  let constructionYears = 0, operationYears = 0;
  let verticalCost = 0;
  const contingencyPct = o.development.contingency ?? 0.05;
  const cb = o.development.costBreakdown || {structure:0.42,mep:0.18,finishes:0.20,external:0.08,fees:0.12};
  const infraCostAmt = (type!=='landbank' && scopeType!=='vertical_only') ? land.area * infraCostPerSqm * costMult : 0;

  if(type==='landbank'){
    hardCostBase = 0; hardCost = 0;
    constructionYears = 0;
    operationYears = o.landbank.holdingYears;
  } else if(type==='development'){
    verticalCost = scopeType==='infra_only' ? 0 : gfa * (o.development.buildCost*costMult) * useInfo.mult * siteFactor;
    hardCostBase = verticalCost + infraCostAmt;
    hardCost = hardCostBase * (1+contingencyPct);
    constructionYears = o.development.constructionYears;
    operationYears = o.development.operationYears;
  } else { // income
    verticalCost = scopeType==='infra_only' ? 0 : gfa * ((o.development.buildCost||3500)*costMult) * useInfo.mult * siteFactor;
    hardCostBase = verticalCost + infraCostAmt;
    hardCost = hardCostBase * (1+contingencyPct);
    constructionYears = o.development.constructionYears || 1;
    operationYears = o.development.operationYears || 5;
  }
  // Cost breakdown (structure/MEP/finishes/external/fees) describes the composition of the
  // VERTICAL building cost only — infrastructure cost is a separate, structurally distinct
  // line item and must not dilute these percentages.
  const costBreakdownAmounts = {
    structure: verticalCost*(cb.structure||0), mep: verticalCost*(cb.mep||0), finishes: verticalCost*(cb.finishes||0),
    external: verticalCost*(cb.external||0), fees: verticalCost*(cb.fees||0), contingency: hardCostBase*contingencyPct,
  };

  // one-time / fixed fund fees
  const oneTimeFixed = o.fees.cmaSetup + o.fees.dueDiligence + o.fees.valuation;
  const structuringFee = o.fees.structuring * (landCost + hardCost);
  const acquisitionFee = o.fees.acquisition * landCost;

  const totalYears = holdStrategy==='perpetual_hold'
    ? Math.max(1, constructionYears + Math.max(1, refi.analysisHorizon||10))
    : Math.max(1, constructionYears + operationYears);

  // Debt sizing — single tranche, or Senior + Mezzanine
  const preTPC = landCost + hardCost + oneTimeFixed + structuringFee + acquisitionFee;
  const totalDebtTarget = preTPC * o.financing.ltc;
  const seniorRate = o.financing.saibor + o.financing.margin + rateDelta;
  let seniorDebt, mezzDebt, interestRate;
  if(o.financing.structure==='senior_mezz'){
    seniorDebt = totalDebtTarget * (o.financing.seniorPct??0.80);
    mezzDebt = totalDebtTarget - seniorDebt;
    const mezzRate = seniorRate + (o.financing.mezzMarginAdj??0.04);
    interestRate = totalDebtTarget>0 ? (seniorDebt*seniorRate + mezzDebt*mezzRate)/totalDebtTarget : seniorRate;
  } else {
    seniorDebt = totalDebtTarget; mezzDebt = 0;
    interestRate = seniorRate;
  }
  const debt = totalDebtTarget;
  const arrangementFee = o.financing.ltc>0 ? o.fees.arrangement * debt : 0;
  const TPC = preTPC + arrangementFee;
  const equity = TPC - debt;

  // WACC (CAPM build-up)
  const Ke = o.wacc.rf + o.wacc.beta*o.wacc.mrp + o.wacc.crp + o.wacc.sp + o.wacc.alpha;
  const Kd = interestRate;
  const V = debt + equity;
  const WACC = V>0 ? (equity/V)*Ke + (debt/V)*Kd : Ke;

  // GLA / revenue assumptions
  const efficiency = (o.development.efficiency)||0.85;
  const gla = type==='income' ? (o.income.gla || gfa*efficiency) : gfa*efficiency;
  const rentAnnual = o.income.rent*rentMult;
  const occupancy = o.income.occupancy;
  const opexPct = o.income.opex;
  const exitCapRateEff = Math.max(0.02, o.development.exitCapRate + capRateDelta);
  const marketCapEff = Math.max(0.02, (o.wacc.marketCap||0.075) + capRateDelta);
  const salePriceEff = o.development.salePrice * salePriceMult;
  const amortType = o.financing.amortType || 'interest_only';
  const graceYears = o.financing.graceYears||0;
  const amortYears = Math.max(1, o.financing.amortYears||10);

  function noiForYear(){
    if(type==='landbank') return 0;
    if(type==='development' && scopeType==='infra_only') return 0; // serviced-plot sale: no interim rental income
    if(assetClass==='hospitality'){
      const hosp = o.income.hospitality||{};
      const revPAR = (hosp.adr||0) * occupancy; // occupancy reused as hotel occupancy rate
      const totalRevenue = revPAR * 365 * (hosp.keys||0);
      const gop = totalRevenue * (hosp.gopMargin!=null? hosp.gopMargin : 0.35);
      return gop * (1 - o.fees.propMgmt);
    }
    if(assetClass==='gas_station' || assetClass==='qsr_pharmacy'){
      const nnn = o.income.nnn||{};
      let totalRent = gla * rentAnnual;
      if(nnn.pctRent){
        const naturalBreakpoint = nnn.pctRentRate>0 ? totalRent/nnn.pctRentRate : Infinity;
        const overage = Math.max(0, (nnn.annualSales||0) - naturalBreakpoint) * nnn.pctRentRate;
        totalRent += overage;
      }
      // NNN (triple-net): tenant covers opex directly, so no opexPct deduction on the landlord's side
      let noi = totalRent * occupancy * (1 - o.fees.propMgmt);
      if(assetClass==='gas_station') noi -= (nnn.envReserveAnnual||0);
      return noi;
    }
    const pgi = gla * rentAnnual;
    const effOcc = type==='development' ? occupancy*(1-salePct) : occupancy; // if selling, rented share shrinks
    const noi = pgi * effOcc * (1-opexPct) * (1 - o.fees.propMgmt);
    return noi;
  }

  // ---- Build year-by-year cashflows (unlevered / project, and levered / equity) ----
  const projectCF = []; const equityCF = []; const dscrSeries = [];
  let remainingDebt = debt;
  let navGrossValue = 0, navDebt = 0; // نلتقط قيمة الأصل والدين المتبقي في سنة الخروج/الاستقرار لحساب NAV بعد الحلقة

  projectCF.push(-TPC);
  const initialEquityOutlay = -(equity) - o.subscription.subscriptionFee*equity;
  equityCF.push(initialEquityOutlay);

  for(let yr=1; yr<=totalYears; yr++){
    const inConstruction = yr<=constructionYears && type!=='landbank';
    let noi = 0;
    if(type==='landbank'){
      noi = -o.landbank.carryAnnual;
    } else if(!inConstruction){
      noi = noiForYear();
    }
    const interest = remainingDebt * interestRate;
    let principalPay = 0;
    if(amortType==='amortizing' && type!=='landbank' && !inConstruction && yr>constructionYears+graceYears && remainingDebt>0){
      principalPay = Math.min(remainingDebt, debt/amortYears);
    }
    const debtService = (type!=='landbank' && remainingDebt>0) ? interest+principalPay : 0;
    const isLast = (yr===totalYears);
    const yearsIntoOperation = yr - constructionYears;
    const isRefiYear = (holdStrategy==='perpetual_hold' && !inConstruction && !isLast && yearsIntoOperation>0
                        && refi.intervalYears>0 && yearsIntoOperation % refi.intervalYears === 0);

    let exitValue = 0, exitCostsAmt = 0, debtPayoff = 0;
    if(isLast){
      if(type==='landbank'){
        exitValue = landCost * Math.pow(1+o.landbank.appreciation, totalYears);
      } else if(type==='development'){
        const sellableArea = scopeType==='infra_only' ? land.area : gfa*efficiency;
        const saleValue = sellableArea * salePriceEff * salePct;
        const rentedValue = (1-salePct)>0 ? (gla*rentAnnual*occupancy*(1-opexPct)*(1-o.fees.propMgmt))/exitCapRateEff : 0;
        exitValue = saleValue + (scopeType==='infra_only' ? 0 : rentedValue);
      } else { // income fund exit via cap rate
        const stabilizedNOI = noiForYear() * Math.pow(1+o.wacc.growth, totalYears);
        exitValue = stabilizedNOI / marketCapEff;
      }
      const exitCostPct = o.exitCosts.broker + o.exitCosts.legal + o.exitCosts.rett + o.exitCosts.exitFee + o.fees.disposition;
      exitCostsAmt = exitValue * exitCostPct;
      debtPayoff = remainingDebt - principalPay; // remaining balance after this year's amortization, paid off at exit
      navGrossValue = exitValue; navDebt = debtPayoff; // القيمة الإجمالية للأصل والدين وقت الاستقرار/الخروج (بدون خصم تكاليف بيع افتراضية — NAV مش عملية بيع فعلية)
    }

    const projFlow = noi + (isLast? (exitValue - exitCostsAmt) : 0);
    const netOperatingCF = noi - debtService; // can be negative: a shortfall is a real equity capital call, not floored to zero

    let equityFlow, newLoanAfterRefi = null;
    if(isLast && holdStrategy==='refinance_close'){
      // exit via cash-out refinance instead of a sale: a new loan pays off the old one,
      // the surplus goes to equity, and the property itself is not sold (no disposition costs).
      const propertyValue = noiForYear() * Math.pow(1+o.wacc.growth, totalYears) / marketCapEff;
      const newLoan = propertyValue * (refi.refiLtv||0.65);
      const refiCost = newLoan * (refi.refiCostPct||0.01);
      const oldDebtRemaining = remainingDebt - principalPay;
      const distribution = Math.max(0, newLoan - oldDebtRemaining - refiCost);
      equityFlow = netOperatingCF + distribution;
    } else if(isRefiYear){
      const propertyValue = noiForYear() * Math.pow(1+o.wacc.growth, yr) / marketCapEff;
      const newLoan = propertyValue * (refi.refiLtv||0.65);
      const refiCost = newLoan * (refi.refiCostPct||0.01);
      const oldDebtRemaining = remainingDebt - principalPay;
      const distribution = Math.max(0, newLoan - oldDebtRemaining - refiCost);
      equityFlow = netOperatingCF + distribution;
      if(distribution>0) newLoanAfterRefi = oldDebtRemaining + distribution + refiCost; // == newLoan
    } else if(isLast){
      equityFlow = netOperatingCF + (exitValue - exitCostsAmt - debtPayoff);
    } else {
      equityFlow = netOperatingCF;
    }

    projectCF.push(projFlow);
    equityCF.push(equityFlow);
    if(!inConstruction && type!=='landbank'){
      dscrSeries.push(debtService>0 ? noi/debtService : (noi>0? 99:0));
    }
    remainingDebt = isLast ? 0 : (newLoanAfterRefi!=null ? newLoanAfterRefi : Math.max(0, remainingDebt - principalPay));
  }

  // perpetual hold: report both a "cash-only" realized series and a "mark-to-market" series
  // that adds the unrealized residual property value (net of remaining debt) at the horizon's end.
  const equityCFCashOnly = equityCF.slice();
  if(holdStrategy==='perpetual_hold'){
    const propertyValueEnd = noiForYear() * Math.pow(1+o.wacc.growth, totalYears) / marketCapEff;
    const residualEquityValue = Math.max(0, propertyValueEnd - remainingDebt);
    equityCF[equityCF.length-1] += residualEquityValue;
  }

  const equityIRR = irr(equityCF);
  const projectIRR = irr(projectCF);
  const npvEquity = npvAt(Ke, equityCF);
  const npvProject = npvAt(WACC, projectCF);
  const totalDistrib = equityCF.slice(1).reduce((a,b)=>a+Math.max(0,b),0);
  const MOIC = equity>0 ? totalDistrib/equity : 0;
  const DPI = MOIC; const RVPI = 0; const TVPI = DPI+RVPI;
  const dscrMin = dscrSeries.length? Math.min(...dscrSeries.filter(x=>isFinite(x))) : null;
  const dscrAvg = dscrSeries.length? dscrSeries.reduce((a,b)=>a+b,0)/dscrSeries.length : null;

  const equityIRRCashOnly = holdStrategy==='perpetual_hold' ? irr(equityCFCashOnly) : equityIRR;
  const totalDistribCashOnly = equityCFCashOnly.slice(1).reduce((a,b)=>a+Math.max(0,b),0);
  const MOICCashOnly = holdStrategy==='perpetual_hold' ? (equity>0 ? totalDistribCashOnly/equity : 0) : MOIC;

  const stabilizedNOIyr1 = type!=='landbank' ? noiForYear() : 0;
  const yieldOnCost = TPC>0 ? stabilizedNOIyr1/TPC : 0;

  // ---- NAV و ROI ----
  // NAV المقدَّر عند الاستقرار/الخروج = القيمة الإجمالية المقدَّرة للأصل (بنفس افتراضات الخروج المستخدمة في التدفقات)
  // ناقص الدين المتبقي وقتها — بدون خصم تكاليف بيع افتراضية (لأن NAV تقييم "ماسك للأصل"، مش عملية بيع فعلية).
  const NAV = navGrossValue - navDebt;
  // ROI بسيط (Cash-on-Cash على مدى العمر) = صافي الربح / رأس المال المستثمر — مقياس مبسّط يكمّل MOIC وIRR،
  // بدون تسوية بالقيمة الزمنية للنقود (على عكس IRR).
  const ROI = equity>0 ? (totalDistrib - equity)/equity : 0;

  // ---- Fees rollups ----
  const mgmtFeeTotal = o.fees.mgmt * (equity+debt)/2 * totalYears; // approx on avg NAV proxy
  const assetMgmtTotal = o.fees.assetMgmt * TPC * totalYears;
  const regAuditCustodianTotal = (o.fees.regAuditCustodian + o.fees.mgmt*0) * totalYears;
  const custodianTotal = 0.0015*(equity)*totalYears;
  const fundSideFees = structuringFee + arrangementFee + mgmtFeeTotal + assetMgmtTotal + regAuditCustodianTotal + oneTimeFixed + acquisitionFee;
  const investorSideFees = o.subscription.subscriptionFee*equity;
  const dispositionFeeAmt = (equityCF[equityCF.length-1]||0) * 0; // already embedded in exit cost pct above
  const feesPctOfTPC = TPC>0 ? fundSideFees/TPC : 0;

  // ---- Waterfall ----
  const PIC = equity;
  const roc = Math.min(PIC, totalDistrib);
  let remaining = totalDistrib - roc;
  const prefTarget = PIC*(Math.pow(1+o.economics.hurdle, totalYears)-1);
  const pref = Math.min(remaining, Math.max(0,prefTarget));
  remaining -= pref;
  const catchupTarget = remaining>0 ? (o.economics.carry/(1-o.economics.carry))*pref : 0;
  const catchup = Math.min(remaining, Math.max(0,catchupTarget));
  remaining -= catchup;
  const lpStandard = (1-o.economics.carry)*remaining;
  const carryPool = o.economics.carry*remaining;
  const lpBonus = o.economics.lpShare*carryPool;
  const gpManager = o.economics.gpShare*carryPool;
  const devPromote = o.economics.devShare*carryPool;
  const lpTotal = roc+pref+lpStandard+lpBonus;
  const gpTotal = catchup+gpManager;
  const devTotal = devPromote;

  // ---- IC verdict checks ----
  const checks = [
    { k:'Equity IRR', v:equityIRR, min:o.criteria.irrMin, fmt:'pct' },
    { k:'DSCR', v:dscrMin, min:o.criteria.dscrMin, fmt:'x' },
    { k:'MOIC', v:MOIC, min:o.criteria.moicMin, fmt:'x' },
    { k:'Yield on Cost', v:type==='landbank'?null:yieldOnCost, min:o.criteria.yocMin, fmt:'pct', skip:type==='development'&&salePct>=0.999 },
    { k:'Project IRR', v:projectIRR, min:o.criteria.projIrrMin, fmt:'pct' },
    { k:'Pre-Leasing', v:o.criteria.preLeasingActual, min:o.criteria.preLeasingMin, fmt:'pct', skip:type!=='income' },
  ];
  let passCount=0, failCount=0, applicable=0;
  checks.forEach(c=>{ if(c.skip || c.v==null || !isFinite(c.v)) return; applicable++; if(c.v>=c.min) passCount++; else failCount++; });
  let verdict = 'good';
  if(npvProject<0 || failCount>=3) verdict='bad';
  else if(failCount>=1) verdict='warn';

  return {
    tierMult, useInfo, siteFactor, landCost, gfa, footprint, floorsNeeded, buildingHeight, landCostPerGFA, masterMultiplier,
    hardCost, hardCostBase, contingencyPct, costBreakdownAmounts,
    oneTimeFixed, structuringFee, acquisitionFee, arrangementFee, TPC, debt, seniorDebt, mezzDebt, equity, interestRate, Ke, Kd, WACC,
    amortType, assetClass, holdStrategy, scopeType, infraCostAmt, verticalCost,
    gla, totalYears, constructionYears, operationYears,
    equityIRR, projectIRR, npvEquity, npvProject, totalDistrib, MOIC, DPI, RVPI, TVPI, dscrMin, dscrAvg,
    equityIRRCashOnly, MOICCashOnly, totalDistribCashOnly,
    stabilizedNOIyr1, yieldOnCost, NAV, ROI,
    mgmtFeeTotal, assetMgmtTotal, regAuditCustodianTotal, fundSideFees, investorSideFees, feesPctOfTPC,
    PIC, roc, pref, catchup, lpStandard, carryPool, lpBonus, gpManager, devPromote, lpTotal, gpTotal, devTotal,
    checks, passCount, failCount, applicable, verdict, salePct,
    projectCF, equityCF, equityCFCashOnly, scenarioKey: scenarioKey||'base',
  };
}

/* Tornado-style one-variable-at-a-time sensitivity on Equity IRR. */
function sensitivityRows(o){
  const isDev = o.meta.oppType==='development';
  const isIncome = o.meta.oppType==='income';
  const bumps = [
    { key:'land.price', label:T('سعر شراء الأرض (م²)','Land Purchase Price (sqm)'), deltaPct:0.10 },
    { key: isDev?'development.salePrice':'income.rent', label: isDev?T('سعر البيع (م²)','Sale Price (sqm)'):T('سعر الإيجار (م²/سنة)','Rent Price (sqm/yr)'), deltaPct:0.10 },
    { key: isDev?'development.exitCapRate':'wacc.marketCap', label:T('معدل الرسملة عند الخروج','Exit Cap Rate'), deltaAbs:0.01 },
    { key:'financing.saibor', label:T('سعر الفائدة (SAIBOR)','Interest Rate (SAIBOR)'), deltaAbs:0.01 },
    { key:'financing.ltc', label:T('نسبة التمويل (LTC)','Financing Ratio (LTC)'), deltaAbs:0.05 },
    { key:'financing.margin', label:T('هامش التمويل فوق SAIBOR','Financing Margin over SAIBOR'), deltaAbs:0.005 },
  ];
  if(isDev){
    bumps.push({ key:'development.buildCost', label:T('تكلفة البناء (م²)','Build Cost (sqm)'), deltaPct:0.08 });
    bumps.push({ key:'development.constructionYears', label:T('مدة الإنشاء (سنوات) — تعجيل/تأخير','Construction Duration (yrs) — accelerate/delay'), deltaAbs:0.5 });
  }
  if(isIncome){
    bumps.push({ key:'income.occupancy', label:T('نسبة الإشغال','Occupancy Rate'), deltaAbs:0.05 });
    bumps.push({ key:'income.opex', label:T('نسبة المصاريف التشغيلية (OPEX)','Operating Expense Ratio (OPEX)'), deltaAbs:0.03 });
  }
  const base = compute(o,'base');
  return bumps.map(b=>{
    const up = JSON.parse(JSON.stringify(o)); const down = JSON.parse(JSON.stringify(o));
    const cur = getPath(up,b.key);
    if(b.deltaPct!=null){ setPath(up,b.key, cur*(1+b.deltaPct)); setPath(down,b.key, cur*(1-b.deltaPct)); }
    else { setPath(up,b.key, cur+b.deltaAbs); setPath(down,b.key, Math.max(0.001,cur-b.deltaAbs)); }
    return { label:b.label, base:base.equityIRR, down:compute(down,'base').equityIRR, up:compute(up,'base').equityIRR };
  });
}

function scenarioCompareRows(o){
  return [
    {key:'pessimistic', label:'🔴 '+T('متشائم','Pessimistic')+' (Pessimistic)'},
    {key:'base', label:'🔵 '+T('الأساسي','Base')+' (Base)'},
    {key:'optimistic', label:'🟢 '+T('متفائل','Optimistic')+' (Optimistic)'},
  ].map(s=>{
    const c = compute(o, s.key);
    return { label:s.label, key:s.key, irr:c.equityIRR, npv:c.npvProject, moic:c.MOIC, verdict:c.verdict };
  });
}

/* =========================================================================
   توصيات لجنة الاستثمار التفصيلية — IC Detailed Recommendations
   ========================================================================= */
const IC_ACTION_LIBRARY = {
  'Equity IRR': ()=>T('خفّضي تكلفة الأرض أو التفاوضي على سداد مؤجّل لجزء منها، راجعي هيكل الدين (LTC/الهامش)، أو أعيدي تسعير الإيجار/سعر البيع إذا سمح السوق.','Lower the land cost or negotiate deferred payment for part of it, review the debt structure (LTC/margin), or reprice the rent/sale price if the market allows.'),
  'DSCR': ()=>T('قلّلي نسبة LTC، تفاوضي على هامش تمويل أقل فوق SAIBOR، أو رفعي صافي الدخل التشغيلي (NOI) بزيادة الإيجار أو تقليل OPEX.','Reduce the LTC ratio, negotiate a lower financing margin over SAIBOR, or raise net operating income (NOI) by increasing rent or cutting OPEX.'),
  'MOIC': ()=>T('مدّدي أفق الاحتفاظ بالأصل قبل البيع، حسّني هامش الربح التشغيلي، أو قلّلي الرسوم والتكاليف غير الأساسية على الصندوق.','Extend the holding horizon before sale, improve the operating margin, or reduce non-essential fees and costs on the fund.'),
  'Yield on Cost': ()=>T('خفّضي تكلفة البناء لكل م²، راجعي مزيج الاستخدامات (Unit/Tenant Mix) لرفع متوسط الإيجار، أو قلّلي التكاليف الناعمة (Soft Costs).','Lower the build cost per sqm, review the unit/tenant mix to raise average rent, or reduce soft costs.'),
  'Project IRR': ()=>T('راجعي الجدول الزمني للإنشاء (تسريع التسليم يرفع IRR غير المموّل) أو خفّضي التكلفة الإنشائية الإجمالية.','Review the construction schedule (faster delivery raises unlevered IRR) or lower total construction cost.'),
  'Pre-Leasing': ()=>T('كثّفي التسويق قبل بدء الإنشاء أو قدّمي حوافز إيجار مبكر (Rent-Free Period) لرفع نسبة التأجير المسبق قبل صرف التمويل البنكي.','Intensify marketing before construction starts or offer early-lease incentives (rent-free period) to raise pre-leasing before bank financing is disbursed.'),
};
function icRecommendations(o, c){
  const recs = [];
  c.checks.forEach(chk=>{
    if(chk.skip || chk.v==null || !isFinite(chk.v)) return;
    if(chk.v >= chk.min) return; // معيار مستوفى — لا حاجة لتوصية
    const valStr = chk.fmt==='pct'? fmtPct(chk.v) : chk.v.toFixed(2)+'×';
    const minStr = chk.fmt==='pct'? fmtPct(chk.min) : chk.min.toFixed(2)+'×';
    const gapStr = chk.fmt==='pct'? ((chk.min-chk.v)*100).toFixed(1)+' '+T('نقطة','pts') : (chk.min-chk.v).toFixed(2)+'×';
    recs.push({ k:chk.k, valStr, minStr, gapStr, action: IC_ACTION_LIBRARY[chk.k]? IC_ACTION_LIBRARY[chk.k]() : T('يحتاج مراجعة تفصيلية من فريق الاستثمار.','Needs detailed review by the investment team.') });
  });
  return recs;
}

/* =========================================================================
   أفكار تحسين القيمة — Value Enhancer Ideas (استشارية، تحتاج مراجعة هندسية/تنظيمية)
   ========================================================================= */
function valueEnhancerIdeas(o){
  const type = o.meta.oppType;
  const ideas = [];
  if(type==='income' || type==='development'){
    ideas.push('إضافة بلكونات/تراسات مكشوفة للوحدات — في عدد من الأنظمة البلدية لا تُحسب (أو تُحسب جزئياً فقط) ضمن معامل البناء الأساسي (FAR)، وترفع القيمة التسويقية دون استهلاك حق بناء كامل — استخدمي حقل "مساحات معفاة تقديرية" في خطوة الأرض لحساب الأثر المحتمل تقديرياً، بعد تأكيد النسبة الفعلية من كود البناء المحلي.');
    ideas.push('استغلال السطح (Roof Utilization) — غرف خدمات مؤجرة، أو مساحات لوحات إعلانية/معدات اتصالات كدخل إضافي هامشي منخفض التكلفة.');
    ideas.push('مراجعة مزيج الوحدات (Unit/Tenant Mix) لصالح الأحجام أو الأنشطة الأعلى طلباً محلياً، بما يرفع متوسط الإيجار أو سعر البيع للمتر.');
  }
  ideas.push('التفاوض على سداد مؤجّل لجزء من ثمن الأرض (Deferred Land Payment) لتخفيف رأس المال المبدئي المطلوب ورفع Equity IRR.');
  ideas.push('دراسة استراتيجية خروج مختلطة (بيع جزئي + تأجير الباقي) لتحسين التوازن بين السيولة الفورية والعائد المتكرر طويل الأجل.');
  if(type==='development'){
    ideas.push('تسريع الجدول الإنشائي (مقاول/طريقة بناء أسرع) لتقليل فترة رسملة التمويل ورفع IRR غير المموّل (Project IRR).');
  }
  if(type==='landbank'){
    ideas.push('متابعة التغييرات التنظيمية/التصنيفية المرتقبة (Zoning) في المنطقة — أي ترقية تصنيف تزيد القيمة السوقية جوهرياً دون أي تكلفة تنموية إضافية.');
    ideas.push('دراسة تقسيم الأرض (Subdivision) لبيعها على قطع أصغر بسعر متر أعلى من البيع كقطعة واحدة، إن سمح النظام العمراني.');
  }
  return ideas;
}

/* =========================================================================
   الأوبتيمايزر — Scenario Optimizer (بحث شبكي على عدة روافع مالية)
   يحترم الحد الأدنى لـ DSCR كقيد أساسي، ولا يقترح أي تعديل على حقوق البناء
   النظامية — فقط روافع مالية/تسعيرية ضمن تحكم الفريق.
   ========================================================================= */
function runOptimizer(o){
  const base = compute(o, 'base');
  const isDev = o.meta.oppType==='development';
  const ltcOptions = [o.financing.ltc, 0.55, 0.60, 0.65, 0.70].filter((v,i,a)=>a.indexOf(v)===i);
  const landDeltaOptions = [0, -0.05, -0.10];
  const priceDeltaOptions = [0, 0.03, 0.05];
  const candidates = [];
  ltcOptions.forEach(ltc=>{
    landDeltaOptions.forEach(landD=>{
      priceDeltaOptions.forEach(priceD=>{
        if(ltc===o.financing.ltc && landD===0 && priceD===0) return; // نفس الوضع الحالي
        const clone = JSON.parse(JSON.stringify(o));
        clone.financing.ltc = Math.min(0.80, Math.max(0.30, ltc));
        clone.land.price = clone.land.price * (1+landD);
        if(isDev) clone.development.salePrice *= (1+priceD);
        else clone.income.rent *= (1+priceD);
        let cc;
        try{ cc = compute(clone, 'base'); }catch(e){ return; }
        if(!isFinite(cc.equityIRR)) return;
        const dscrOk = cc.dscrMin==null || cc.dscrMin >= (o.criteria.dscrMin||0);
        if(!dscrOk) return;
        candidates.push({ ltc:clone.financing.ltc, landD, priceD, irr:cc.equityIRR, moic:cc.MOIC, dscr:cc.dscrMin });
      });
    });
  });
  candidates.sort((a,b)=>b.irr-a.irr);
  return { base, best: candidates[0]||null, triedCount: candidates.length };
}

        const holdStrategyHtml = `
          <p class="step-sub" style="margin-top:16px;">${T('استراتيجية الاحتفاظ والخروج','Hold & Exit Strategy')}</p>
          <div class="grid3">
            ${F.select('income.holdStrategy','استراتيجية الاحتفاظ','Hold strategy', holdStrategy,
              [['بيع عند نهاية المدة (Exit via Sale)','exit_sale'],['إعادة تمويل لإغلاق الصندوق (Refinance to Close)','refinance_close'],['احتفاظ دائم بدخل مستمر (Perpetual Hold)','perpetual_hold']],

        return `${revenueFieldsHtml}${nnnHtml}${specialtyHtml}${holdStrategyHtml}${costBreakdownHtml}`;

    case 8: return `

      <div class="grid3">
        ${F.pct('exitCosts.broker','عمولة السمسرة','Broker commission', d.exitCosts.broker, {dec:2})}
        ${F.pct('exitCosts.legal','رسوم قانونية وتصرف','Legal / disposal', d.exitCosts.legal, {dec:2})}

    case 9: return `
      <div class="grid3">
        ${F.pct('criteria.irrMin','الحد الأدنى Equity IRR','Min equity IRR', d.criteria.irrMin, {dec:1})}

        ${F.num('criteria.moicMin','الحد الأدنى MOIC','Min MOIC', d.criteria.moicMin, {suffix:'×', step:0.05})}
        ${F.pct('criteria.yocMin','الحد الأدنى Yield on Cost','Min yield on cost', d.criteria.yocMin, {dec:1})}
        ${F.pct('criteria.projIrrMin','الحد الأدنى Project IRR','Min project IRR', d.criteria.projIrrMin, {dec:1})}
        ${F.pct('criteria.preLeasingMin','الحد الأدنى للتأجير المسبق','Min pre-leasing', d.criteria.preLeasingMin, {dec:0})}

    case 10: {
      const cd = d.closing;

      <div class="grid3">
        ${F.select('closing.titleDeed','صك الملكية','Title deed', cd.titleDeed, STATUS_OPTS)}

      </div>
      <p class="step-sub" style="margin-top:16px;">${T('شروط الإغلاق وقائمة العناية الواجبة','Closing conditions & due diligence checklist')} (Closing Conditions Checklist)</p>
      <div class="cond-list">
        ${cd.conditions.map((row,i)=>`
          <div class="cond-row">
            <input type="text" name="closing.conditions.${i}.text" value="${esc(row.text)}" placeholder="${T('وصف الشرط...','Condition description...')}">
            <select name="closing.conditions.${i}.status">
              <option value="pending" ${row.status==='pending'?'selected':''}>⏳ ${T('قيد الانتظار','Pending')}</option>
              <option value="met" ${row.status==='met'?'selected':''}>✅ ${T('مستوفى','Met')}</option>
              <option value="waived" ${row.status==='waived'?'selected':''}>➖ ${T('متنازل عنه','Waived')}</option>
            </select>
            <button type="button" class="btn btn-sm btn-ghost" data-action="remove-condition" data-idx="${i}" title="${T('حذف','Delete')}">🗑️</button>
          </div>`).join('')}
      </div>
      <button type="button" class="btn btn-sm" data-action="add-condition" style="margin-top:10px;">＋ ${T('إضافة شرط','Add condition')}</button>
      ${F.textarea('closing.ddNotes','ملاحظات العناية الواجبة','Due diligence notes', cd.ddNotes, {placeholder:'نتائج مبدئية لفحص العناية الواجبة، مخاطر مكتشفة، إلخ...'})}
      `;
    }
    case 11: {
      const c = compute(d);
      return renderReviewSummary(d,c);
    }
  }
  return '';
}

function liveMetricsHtml(d){
  const c = compute(d);
  return `<div class="lg">
    <div class="li">${T('تكلفة الأرض','Land cost')}<b>${fmtSAR(c.landCost)}</b></div>
    <div class="li">GFA<b>${fmtNum(c.gfa)} ${T('م²','sqm')}</b></div>
    <div class="li">${T('إجمالي تكلفة المشروع','Total project cost')} (TPC)<b>${fmtSAR(c.TPC)}</b></div>
    <div class="li">${T('حقوق الملكية','Equity')}<b>${fmtSAR(c.equity)}</b></div>
    <div class="li">WACC<b>${fmtPct(c.WACC)}</b></div>
    <div class="li">Equity IRR<b>${fmtPct(c.equityIRR)}</b></div>
    <div class="li">MOIC<b>${c.MOIC.toFixed(2)}×</b></div>
    <div class="li">${T('الحكم الأولي','Initial verdict')}<b>${c.verdict==='good'?'🟢 '+T('قوي','Strong'):c.verdict==='warn'?'🟡 '+T('مراجعة','Review'):'🔴 '+T('دون المعايير','Below target')}</b></div>
  </div>`;
}

function updateLivePreview(){
  const el = document.getElementById('livePreviewBox');
  if(el) el.innerHTML = liveMetricsHtml(wizard.draft);
}

function renderReviewSummary(d,c){
  return `

      <div class="k">${T('المدينة / الحي / الفئة','City / Neighborhood / Tier')}</div><div class="v" style="font-family:inherit; direction:rtl; unicode-bidi:plaintext;">${esc(d.meta.city)} · ${esc(d.meta.neighborhood||'—')} · ${esc(d.meta.tier)}</div>
      <div class="k">${T('نوع الفرصة','Opportunity Type')}</div><div class="v" style="font-family:inherit; direction:rtl; unicode-bidi:plaintext;">${OPP_TYPE_INFO[d.meta.oppType].ic} ${OPP_TYPE_INFO[d.meta.oppType].t}</div>

      <div class="kpi" style="box-shadow:none;"><div class="l">Equity IRR</div><div class="v">${fmtPct(c.equityIRR)}</div></div>

      <div class="kpi" style="box-shadow:none;"><div class="l">${T('DSCR الأدنى','Minimum DSCR')}</div><div class="v">${c.dscrMin!=null?c.dscrMin.toFixed(2)+'×':'—'}</div></div>
      <div class="kpi" style="box-shadow:none;"><div class="l">WACC</div><div class="v">${fmtPct(c.WACC)}</div></div>
      <div class="kpi" style="box-shadow:none;"><div class="l">${T('NPV المشروع','Project NPV')}</div><div class="v" style="font-size:16px;">${fmtSAR(c.npvProject)}</div></div>
    </div>

function filteredOpportunities(){
  return opportunities.filter(o=>{
    if(dashFilterCity!=='all' && (o.data.meta.city||'')!==dashFilterCity) return false;
    if(dashFilterType!=='all' && (o.data.meta.oppType||'')!==dashFilterType) return false;
    return true;
  });
}

function portfolioKPIs(){
  const list = filteredOpportunities();
  const n_ = list.length;
  let tpcSum=0, debtSum=0, equitySum=0, navSum=0, irrs=[], projIrrs=[], rois=[], moics=[], dscrs=[], yocs=[], waccs=[], niys=[], good=0,warn=0,bad=0;
  const byType = {}, byCity = {}, byMonth = {};
  list.forEach(o=>{
    const c = compute(o.data);
    tpcSum += c.TPC||0; debtSum += c.debt||0; equitySum += c.equity||0; navSum += c.NAV||0;
    if(isFinite(c.equityIRR)) irrs.push(c.equityIRR);
    if(isFinite(c.projectIRR)) projIrrs.push(c.projectIRR);
    if(isFinite(c.ROI)) rois.push(c.ROI);
    if(isFinite(c.MOIC)) moics.push(c.MOIC);
    if(c.dscrMin!=null && isFinite(c.dscrMin)) dscrs.push(c.dscrMin);
    if(isFinite(c.yieldOnCost)) yocs.push(c.yieldOnCost);
    if(isFinite(c.WACC)) waccs.push(c.WACC);
    const refNiy = USE_TYPES[o.data.meta.useType] ? USE_TYPES[o.data.meta.useType].niy : null;
    if(refNiy!=null && isFinite(refNiy)) niys.push(refNiy);
    if(c.verdict==='good') good++; else if(c.verdict==='warn') warn++; else bad++;
    const ti = OPP_TYPE_INFO[o.data.meta.oppType];
    const tlabel = ti? T(ti.t, ti.en) : o.data.meta.oppType;
    byType[tlabel] = (byType[tlabel]||0) + (c.TPC||0);
    const city = o.data.meta.city || T('غير محدد','Unspecified');
    byCity[city] = (byCity[city]||0) + (c.TPC||0);
    const monthKey = (o.data.meta.createdAt||'').slice(0,7); // YYYY-MM
    if(monthKey) byMonth[monthKey] = (byMonth[monthKey]||0) + 1;
  });
  const avg = arr => arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  return { n_, tpcSum, debtSum, equitySum, navSum, avgIrr:avg(irrs), avgProjIrr:avg(projIrrs), avgRoi:avg(rois), avgMoic:avg(moics), avgDscr:avg(dscrs), avgYoc:avg(yocs), avgWacc:avg(waccs), avgNiy:avg(niys), good, warn, bad, byType, byCity, byMonth, list };
}

function renderBenchmarkPanel(k){
  const list = k.list.filter(o=>o.data.meta.oppType==='income');
  if(!list.length) return '';
  const byUse = {};
  list.forEach(o=>{
    const c = compute(o.data);
    const ut = o.data.meta.useType;
    if(!isFinite(c.yieldOnCost)) return;
    (byUse[ut] = byUse[ut]||[]).push(c.yieldOnCost);
  });
  const rows = Object.keys(byUse).map(ut=>{
    const arr = byUse[ut];
    const avgActual = arr.reduce((a,b)=>a+b,0)/arr.length;
    const ref = USE_TYPES[ut] ? USE_TYPES[ut].niy : null;
    return { ut, avgActual, ref, delta: ref!=null? avgActual-ref : null };
  }).filter(r=>r.ref!=null);
  if(!rows.length) return '';
  return `
  <div class="panel" style="margin-top:14px; padding:18px 20px;">
    <div class="panel-head" style="border:none; padding:0 0 4px;">
      <h2>🎯 ${T('الأداء مقابل المعايير المرجعية','Performance vs. Benchmarks')} <span style="color:var(--ink-faint); font-weight:500;">— Yield on Cost ${T('الفعلي مقابل NIY المرجعي','actual vs. benchmark NIY')}</span></h2>
    </div>
    <p class="note" style="margin:0 0 16px;">
      ${T('المعايير هنا هي جداول الأداة الداخلية (نفس أرقام "NIY المرجعي" المستخدمة أثناء إدخال كل فرصة) وليست بيانات سوق حية مباشرة — عدّليها في جدول USE_TYPES بملف','These benchmarks are the tools internal tables (the same "benchmark NIY" figures used when entering each opportunity) — not live market data. Update them in the USE_TYPES table in the file')} <span class="mono">index.html</span> ${T('كلما توفرت لك أرقام أحدث من تقارير السوق.','whenever newer figures are available from market reports.')}
    </p>
    <div class="bars">
      ${rows.map(r=>{
        const good = r.delta>=0;
        const maxV = Math.max(r.avgActual, r.ref, 0.001) * 1.15;
        return `
        <div class="barrow">
          <div class="lbl">
            <span>${esc(r.ut)}</span>
            <span class="num mono">${T('فعلي','Actual')} ${fmtPct(r.avgActual)} · ${T('مرجعي','Benchmark')} ${fmtPct(r.ref)} · <b style="color:${good?'var(--good)':'var(--bad)'};">${good?'+':''}${(r.delta*100).toFixed(1)} ${T('نقطة','pts')}</b></span>
          </div>
          <div class="track" style="position:relative;">
            <div class="fill" style="width:${Math.min(100,(r.avgActual/maxV)*100)}%; background:${good?'var(--good)':'var(--bad)'};"></div>
            <div style="position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); right:${100-Math.min(100,(r.ref/maxV)*100)}%;" title="${T('المرجعي','Benchmark')}: ${fmtPct(r.ref)}"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function sortedOpportunities(){
  const arr = opportunities.slice();
  arr.sort((a,b)=>{
    function val(o){
      if(sortKey==='name') return o.data.meta.name||'';
      if(sortKey==='city') return o.data.meta.city||'';
      if(sortKey==='type') return o.data.meta.oppType||'';
      if(sortKey==='tpc') return compute(o.data).TPC;
      if(sortKey==='irr') return compute(o.data).equityIRR||-999;
      if(sortKey==='moic') return compute(o.data).MOIC||0;
      if(sortKey==='verdict') return ({good:2,warn:1,bad:0})[compute(o.data).verdict];
      return o.data.meta.updatedAt||o.data.meta.createdAt||'';
    }
    const va=val(a), vb=val(b);
    let cmp = typeof va==='string'? va.localeCompare(vb) : (va-vb);
    return sortDir==='asc'? cmp : -cmp;
  });
  return arr;
}

function checkRow(c){
  const rows = c.checks.filter(x=>!x.skip && x.v!=null && isFinite(x.v));
  return rows.map(r=>{
    const pass = r.v>=r.min;
    const vs = r.fmt==='pct'? fmtPct(r.v) : r.v.toFixed(2)+'×';
    const ms = r.fmt==='pct'? fmtPct(r.min) : r.min.toFixed(2)+'×';
    return `<tr><td>${r.k}</td><td class="num">${vs}</td><td class="num">≥ ${ms}</td>
      <td><span class="pill" style="background:${pass?'var(--good-soft)':'var(--bad-soft)'};color:${pass?'var(--good)':'var(--bad)'}">${pass?'✅ '+T('متجاوز','Passed'):'❌ '+T('دون الهدف','Below Target')}</span></td></tr>`;
  }).join('');
}

function barRow(label,val,total,color){
  const pct = total>0? Math.max(0,Math.min(100,(val/total)*100)) : 0;
  return `<div class="barrow"><div class="lbl"><span>${label}</span><span class="num mono">${fmtSAR(val)} · ${pct.toFixed(0)}%</span></div>
    <div class="track"><div class="fill" style="width:${pct}%; background:${color};"></div></div></div>`;
}

function renderWizardModal(){
  if(!wizard) return '';
  const idx = wizard.step, d = wizard.draft;
  const isLast = idx===STEPS.length-1;
  const pct = ((idx+1)/STEPS.length)*100;
  const showLive = idx>=1 && idx<=10;
  return `<div class="overlay" data-action="overlay-noop">
    <div class="modal" id="wizard-modal">
      <div class="modal-head">
        <div>
          <div style="font-weight:700; font-size:14.5px;">${T(esc(STEPS[idx].t), STEPS[idx].en)} <span style="color:var(--ink-faint); font-weight:500;">— ${T(STEPS[idx].en, esc(STEPS[idx].t))}</span></div>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <div class="steps">${idx+1} / ${STEPS.length}</div>
          <button class="btn btn-sm btn-ghost" data-action="close-wizard">✕</button>
        </div>
      </div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="modal-body" id="wizard-body">
        ${renderStepFields(idx,d)}
        ${showLive? `<div class="livebox" id="livePreviewBox">${liveMetricsHtml(d)}</div>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn" data-action="wizard-back" ${idx===0?'style="visibility:hidden"':''}>→ ${T('السابق','Back')}</button>
        ${isLast
          ? `<button class="btn btn-primary" data-action="wizard-save">✅ ${T('حفظ في القاعدة','Save to Database')}</button>`
          : `<button class="btn btn-primary" data-action="wizard-next">${T('التالي','Next')} ←</button>`}
      </div>
    </div>
  </div>`;
}

function renderConfirmDelete(){
  if(!confirmDeleteId) return '';
  const rec = opportunities.find(o=>o.id===confirmDeleteId);
  return `<div class="overlay" data-action="cancel-delete">
    <div class="modal" style="max-width:400px;">
      <div class="modal-body" style="text-align:center; padding:30px 26px;">
        <div style="font-size:32px; margin-bottom:10px;">🗑️</div>

/* ---------------- charts (Chart.js) ---------------- */
const CHART_COLORS = { accent:'#0E6B4C', accentSoft:'rgba(14,107,76,0.16)', gold:'#9C7B2E', good:'#1E8A56', goodSoft:'rgba(30,138,86,0.18)', warn:'#9C6A0A', warnSoft:'rgba(156,106,10,0.18)', bad:'#AE2E22', badSoft:'rgba(174,46,34,0.18)', inkFaint:'#7C877E', grid:'rgba(20,28,22,0.08)' };
let chartInstances = {};
function destroyChart(id){ if(chartInstances[id]){ try{ chartInstances[id].destroy(); }catch(e){} delete chartInstances[id]; } }
function mkChart(id, config){
  if(typeof Chart==='undefined') return; // CDN blocked/offline — charts are a visual enhancement, never load-bearing
  const canvas = document.getElementById(id);
  if(!canvas) return;
  destroyChart(id);
  try{ chartInstances[id] = new Chart(canvas, config); }catch(e){ console.error('chart render failed:', id, e); }
}
const CHART_BASE_OPTS = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ color:CHART_COLORS.inkFaint, font:{ family:'IBM Plex Sans Arabic, sans-serif', size:11 } } } },
  scales:{ x:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:10 } }, grid:{ color:CHART_COLORS.grid } }, y:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:10 } }, grid:{ color:CHART_COLORS.grid } } } };

function initPortfolioCharts(){
  const k = portfolioKPIs();
  if(k.n_===0) return;
  const typeLabels = Object.keys(k.byType);
  mkChart('chart-portfolio-type', { type:'doughnut',
    data:{ labels:typeLabels, datasets:[{ data:typeLabels.map(t=>k.byType[t]), backgroundColor:[CHART_COLORS.accent, CHART_COLORS.gold, CHART_COLORS.inkFaint, CHART_COLORS.good, CHART_COLORS.warn], borderColor:'var(--surface)', borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ color:CHART_COLORS.inkFaint, font:{ family:'IBM Plex Sans Arabic, sans-serif', size:10 }, boxWidth:10, padding:8 } } } } });
  mkChart('chart-portfolio-verdict', { type:'bar',
    data:{ labels:['🟢 '+T('قوي','Strong'),'🟡 '+T('مراجعة','Review'),'🔴 '+T('دون المعايير','Below Standards')], datasets:[{ data:[k.good,k.warn,k.bad], backgroundColor:[CHART_COLORS.good, CHART_COLORS.warn, CHART_COLORS.bad], borderRadius:6, maxBarThickness:40 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
      scales:{ x:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:10 } }, grid:{ display:false } }, y:{ beginAtZero:true, ticks:{ color:CHART_COLORS.inkFaint, precision:0 }, grid:{ color:CHART_COLORS.grid } } } } });

  // توزيع المحفظة حسب المدينة (TPC) — أعلى 8 مدن
  const cityEntries = Object.entries(k.byCity).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(document.getElementById('chart-portfolio-city')){
    mkChart('chart-portfolio-city', { type:'bar',
      data:{ labels:cityEntries.map(e=>e[0]), datasets:[{ label:'TPC', data:cityEntries.map(e=>e[1]),
        backgroundColor:CHART_COLORS.accentSoft, borderColor:CHART_COLORS.accent, borderWidth:1.5, borderRadius:6, maxBarThickness:26 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(ctx)=>fmtSAR(ctx.raw) } } },
        scales:{ x:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:10 }, callback:(v)=>fmtSAR(v) }, grid:{ color:CHART_COLORS.grid } },
          y:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:10 } }, grid:{ display:false } } } } });
  }

  // Equity IRR لكل فرصة — أعلى ١٢ فرصة حسب IRR
  const irrRows = k.list.map(o=>{
    const c = compute(o.data);
    return { name: o.data.meta.name || T('بدون اسم','Unnamed'), irr: c.equityIRR, verdict: c.verdict };
  }).filter(r=>isFinite(r.irr)).sort((a,b)=>b.irr-a.irr).slice(0,12);
  if(document.getElementById('chart-portfolio-irr')){
    mkChart('chart-portfolio-irr', { type:'bar',
      data:{ labels:irrRows.map(r=>r.name), datasets:[{ label:'Equity IRR', data:irrRows.map(r=>r.irr*100),
        backgroundColor:irrRows.map(r=>r.verdict==='good'?CHART_COLORS.goodSoft:r.verdict==='warn'?CHART_COLORS.warnSoft:CHART_COLORS.badSoft),
        borderColor:irrRows.map(r=>r.verdict==='good'?CHART_COLORS.good:r.verdict==='warn'?CHART_COLORS.warn:CHART_COLORS.bad),
        borderWidth:1.5, borderRadius:6, maxBarThickness:22 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(ctx)=>ctx.raw.toFixed(1)+'%' } } },
        scales:{ x:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:10 }, callback:(v)=>v+'%' }, grid:{ color:CHART_COLORS.grid } },
          y:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:9 } }, grid:{ display:false } } } } });
  }

  // خط زمني لعدد الفرص المضافة شهرياً
  const monthKeys = Object.keys(k.byMonth).sort();
  if(document.getElementById('chart-portfolio-timeline')){
    mkChart('chart-portfolio-timeline', { type:'line',
      data:{ labels:monthKeys, datasets:[{ label:T('فرص مُضافة','Opportunities Added'), data:monthKeys.map(m=>k.byMonth[m]),
        borderColor:CHART_COLORS.accent, backgroundColor:CHART_COLORS.accentSoft, fill:true, tension:0.25, pointRadius:3, pointBackgroundColor:CHART_COLORS.accent }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
        scales:{ x:{ ticks:{ color:CHART_COLORS.inkFaint, font:{ size:10 } }, grid:{ display:false } },
          y:{ beginAtZero:true, ticks:{ color:CHART_COLORS.inkFaint, precision:0 }, grid:{ color:CHART_COLORS.grid } } } } });
  }
}

function initDetailCharts(id){
  const rec = opportunities.find(o=>o.id===id);
  if(!rec) return;
  const d = withDefaults(rec.data), c = compute(d);

  if(document.getElementById('chart-cashflow')){
    const years = c.equityCF.map((_,i)=>i===0?T('الإنشاء','Construction'):T('سنة ','Year ')+i);
    mkChart('chart-cashflow', { type:'bar',
      data:{ labels:years, datasets:[{ label:T('التدفق النقدي لحقوق الملكية','Equity Cash Flow'), data:c.equityCF,
        backgroundColor:c.equityCF.map(v=>v>=0?CHART_COLORS.goodSoft:CHART_COLORS.badSoft), borderColor:c.equityCF.map(v=>v>=0?CHART_COLORS.good:CHART_COLORS.bad), borderWidth:1.5, borderRadius:4 }] },
      options:Object.assign({}, CHART_BASE_OPTS, { plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(ctx)=>fmtSAR(ctx.raw) } } },
        scales:{ x:CHART_BASE_OPTS.scales.x, y:Object.assign({}, CHART_BASE_OPTS.scales.y, { ticks:{ color:CHART_COLORS.inkFaint, callback:(v)=>fmtSAR(v) } }) } }) });
  }
  if(document.getElementById('chart-scenarios')){
    const rows = scenarioCompareRows(d);
    mkChart('chart-scenarios', { type:'bar',
      data:{ labels:rows.map(r=>r.label), datasets:[{ label:'Equity IRR', data:rows.map(r=>r.irr*100),
        backgroundColor:[CHART_COLORS.badSoft, CHART_COLORS.accentSoft, CHART_COLORS.goodSoft], borderColor:[CHART_COLORS.bad, CHART_COLORS.accent, CHART_COLORS.good], borderWidth:1.5, borderRadius:6, maxBarThickness:60 }] },
      options:Object.assign({}, CHART_BASE_OPTS, { indexAxis:'y', plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(ctx)=>ctx.raw.toFixed(1)+'%' } } },
        scales:{ x:Object.assign({}, CHART_BASE_OPTS.scales.x, { ticks:{ color:CHART_COLORS.inkFaint, callback:(v)=>v+'%' } }), y:CHART_BASE_OPTS.scales.y } }) });
  }
  if(document.getElementById('chart-sensitivity')){
    const rows = sensitivityRows(d);
    // floating-bar tornado: each row spans [min(down,up), max(down,up)] around the base value
    mkChart('chart-sensitivity', { type:'bar',
      data:{ labels:rows.map(r=>r.label), datasets:[{ label:T('مدى Equity IRR','Equity IRR Range'), data:rows.map(r=>[Math.min(r.down,r.up)*100, Math.max(r.down,r.up)*100]),
        backgroundColor:CHART_COLORS.accentSoft, borderColor:CHART_COLORS.accent, borderWidth:1.5, borderRadius:6 }] },
      options:Object.assign({}, CHART_BASE_OPTS, { indexAxis:'y', plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ label:(ctx)=>`${T('سلبي','Down')} ${ctx.raw[0].toFixed(1)}% — ${T('إيجابي','Up')} ${ctx.raw[1].toFixed(1)}%` } } },
        scales:{ x:Object.assign({}, CHART_BASE_OPTS.scales.x, { ticks:{ color:CHART_COLORS.inkFaint, callback:(v)=>v+'%' } }), y:CHART_BASE_OPTS.scales.y } }) });
  }
}

function initCharts(){
  initPortfolioCharts();
  if(openDetailId) initDetailCharts(openDetailId);
}

        <label style="display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;">${T('اسم الشركة (يظهر بجانب الشعار في الطباعة)','Company name (appears next to the logo when printing)')}</label>
        <div style="display:flex; gap:8px; margin-bottom:16px;">

          <button class="btn btn-primary btn-sm" data-action="branding-save" ${brandingBusy?'disabled':''}>${T('حفظ','Save')}</button>

        <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">
          ${previewLogo? `<img src="${previewLogo}" alt="${T('شعار الشركة','Company logo')}" style="height:52px; max-width:120px; object-fit:contain; border:1px solid var(--border); border-radius:6px; background:#fff; padding:4px;">`
            : `<div style="height:52px; width:80px; border:1px dashed var(--border); border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:11px;">${T('لا يوجد شعار','No logo')}</div>`}
          <div style="display:flex; flex-direction:column; gap:6px;">
            <input type="file" id="branding-logo-file" data-action="branding-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="font-size:12px;">
            ${(branding.logoDataUrl || brandingLogoDraft)? `<button class="btn btn-sm btn-danger" data-action="branding-remove-logo" ${brandingBusy?'disabled':''} style="width:fit-content;">${T('إزالة الشعار','Remove Logo')}</button>` : ''}
          </div>
        </div>
        ${brandingLogoDraft!==null? `<div class="note" style="color:var(--warn);">${T('تم اختيار شعار جديد — اضغطي «حفظ» بالأعلى لتثبيته.','A new logo was selected — click “Save” above to apply it.')}</div>` : ''}
      </div>
    </div>
  </div>
  `;
}

  const unread = unreadActivityCount();

  <span class="activity-bell-wrap">
    <button class="btn btn-sm activity-bell-btn" data-action="toggle-activity-panel" title="${T('نشاط حديث','Recent activity')}">
      🔔${unread>0? ` <span class="activity-badge">${unread>9?'9+':unread}</span>` : ''}

    ${recentActivityOpen? renderActivityDropdown() : ''}

}
function renderActivityDropdown(){

      ? `<div class="note">🔔 ${T('تنبيهات المتصفح مُفعَّلة — هتوصلك حتى لو التبويب مش مفتوح.','Browser notifications are enabled — you will get them even if the tab is not open.')}</div>`
