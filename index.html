<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة ذكاء الاستثمار العقاري — Opal Real Estate Intelligence</title>
<meta name="description" content="منصة ذكاء الاستثمار العقاري — أداة تقييم وتحليل جدوى الفرص الاستثمارية العقارية من شركة أوبال القابضة (Opal Holding)">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  /* لوحة ألوان مُعاد تصميمها لتنسجم مع هوية أوبال البصرية (رمادي غرافيت + تركواز عميق راقٍ) بدل الأخضر الترابي السابق. */
  --paper:#F5F5F3; --surface:#FFFFFF; --surface-2:#ECEBE7; --surface-3:#E1E0DA;
  --ink:#1B1D22; --ink-soft:#565A63; --ink-faint:#888C95; --border:#DCDAD3;
  --accent:#1F5F6B; --accent-ink:#FFFFFF; --accent-soft:#E3EEF0; --accent-soft-ink:#164A54;
  --gold:#A8823A; --gold-soft:#F2E8D2;
  --good:#1F7A52; --good-soft:#DEF0E5;
  --warn:#A6741F; --warn-soft:#F5EAD3;
  --bad:#B33A2C; --bad-soft:#F8E1DC;
  --shadow: 0 1px 2px rgba(20,22,28,.06), 0 8px 24px -12px rgba(20,22,28,.18);
  --radius: 12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161B; --surface:#1B1E25; --surface-2:#21252D; --surface-3:#2A2F39;
    --ink:#ECEDEF; --ink-soft:#A8ACB5; --ink-faint:#767B85; --border:#2F3440;
    --accent:#54BFCB; --accent-ink:#06181B; --accent-soft:#1B2E32; --accent-soft-ink:#82D5DE;
    --gold:#D9B978; --gold-soft:#2C260F;
    --good:#4FC988; --good-soft:#173125;
    --warn:#E3B25B; --warn-soft:#2E2611;
    --bad:#E38176; --bad-soft:#301917;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#14161B; --surface:#1B1E25; --surface-2:#21252D; --surface-3:#2A2F39;
  --ink:#ECEDEF; --ink-soft:#A8ACB5; --ink-faint:#767B85; --border:#2F3440;
  --accent:#54BFCB; --accent-ink:#06181B; --accent-soft:#1B2E32; --accent-soft-ink:#82D5DE;
  --gold:#D9B978; --gold-soft:#2C260F;
  --good:#4FC988; --good-soft:#173125;
  --warn:#E3B25B; --warn-soft:#2E2611;
  --bad:#E38176; --bad-soft:#301917;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Sakkal Majalla','Segoe UI',Arial,sans-serif;
  font-size:15.5px; line-height:1.65;
}
html[lang="en"] body{ font-family:Aptos,'Segoe UI',Arial,sans-serif; }
h1,h2,h3,.display{ font-family:'Sakkal Majalla','Segoe UI',Arial,sans-serif; }
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,html[lang="en"] .display{ font-family:Aptos,'Segoe UI',Arial,sans-serif; }
.num, .ltr, .mono{ direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; font-family:Aptos,'Segoe UI',Arial,sans-serif; }
.mono{ font-variant-numeric:tabular-nums; }
::selection{ background:var(--accent-soft); color:var(--accent-soft-ink); }
a{color:var(--accent);}
button{font-family:inherit;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- shell ---------- */
.app{ max-width:1280px; margin:0 auto; padding:20px 20px 64px; }
.topbar{
  position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 20px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px;
}
.topbar::after{ content:""; position:absolute; inset-inline:0; bottom:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--gold),transparent 72%); opacity:.9; }
.brand{ display:flex; align-items:center; gap:12px; }
.brand .mark{
  width:42px;height:42px;border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-weight:700;font-size:19px;
  font-family:'Sakkal Majalla','Segoe UI',Arial,sans-serif; flex:none; overflow:hidden; padding:4px; box-shadow:inset 0 0 0 1px var(--border);
}
.brand .mark img{ width:100%; height:100%; object-fit:contain; }
.opal-footer{
  margin-top:28px; padding:18px 20px; text-align:center; color:var(--ink-faint); font-size:11.5px;
  border-top:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:8px;
}
.opal-footer img{ height:34px; width:auto; opacity:.92; }
.opal-footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
.opal-footer a:hover{ text-decoration:underline; }
.brand h1{ font-size:19px; margin:0; font-weight:700; }
.brand .sub{ font-size:11.5px; color:var(--ink-faint); direction:ltr; text-align:right; letter-spacing:.02em; }
.btn{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:filter .12s, transform .08s;
}
.btn:hover{ filter:brightness(0.97); }
.btn:active{ transform:scale(.98); }
.btn:focus-visible, .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible, a:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-danger{ background:var(--bad-soft); border-color:var(--bad-soft); color:var(--bad); }
.btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:7px; }

/* ---------- KPI strip ---------- */
.kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px; }
.kpi{ background:var(--surface); border:1px solid var(--border); border-inline-start:3px solid transparent; border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); transition:transform .15s ease, box-shadow .15s ease; }
.kpi:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(20,28,22,.10), 0 14px 30px -14px rgba(20,28,22,.24); }
.kpi .l{ font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:6px; }
.kpi .v{ font-size:22px; font-weight:700; font-family:Aptos,'Segoe UI',Arial,sans-serif; direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; text-align:right; }
.kpi .v small{ font-size:12px; color:var(--ink-faint); font-weight:500; font-family:'Sakkal Majalla','Segoe UI',Arial,sans-serif; }
/* ألوان مؤشرات لوحة القيادة — لكل فئة لون مميز بدل الرمادي الموحّد */
.kpi-accent{ border-inline-start-color:var(--accent); }
.kpi-accent .v{ color:var(--accent); }
.kpi-gold{ border-inline-start-color:var(--gold); }
.kpi-gold .v{ color:var(--gold); }
.kpi-warn{ border-inline-start-color:var(--warn); }
.kpi-warn .v{ color:var(--warn); }
.kpi-good{ border-inline-start-color:var(--good); }
.kpi-good .v{ color:var(--good); }
.kpi-bad{ border-inline-start-color:var(--bad); }
.kpi-bad .v{ color:var(--bad); }
.kpi-ink{ border-inline-start-color:var(--ink-soft); }

/* ---------- شريط أهم مؤشرات لوحة القيادة (أول ما يُرى) ---------- */
.dash-hero{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
.dash-hero-card{
  position:relative; overflow:hidden; border-radius:var(--radius); padding:16px 18px 14px;
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
}
.dash-hero-card:hover{ transform:translateY(-3px); box-shadow:0 6px 14px rgba(20,28,22,.12), 0 18px 34px -16px rgba(20,28,22,.28); }
.dash-hero-card::before{ content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--accent-color, var(--accent)); }
.dash-hero-card .icon{ font-size:18px; margin-bottom:8px; display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:10px; background:var(--accent-soft); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent); }
.dash-hero-card .l{ font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:6px; }
.dash-hero-card .v{ font-size:24px; font-weight:800; font-family:Aptos,'Segoe UI',Arial,sans-serif; direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; text-align:right; color:var(--ink); }
.dash-hero-card .v small{ font-size:13px; color:var(--ink-faint); font-weight:500; font-family:'Sakkal Majalla','Segoe UI',Arial,sans-serif; }
.dash-hero-card .sub{ font-size:10.5px; color:var(--ink-faint); margin-top:4px; }

/* ---------- عناوين أقسام لوحة القيادة (تجميع منطقي للمؤشرات) ---------- */
.dash-section{ margin-bottom:16px; }
.dash-section-title{
  display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--ink-soft);
  margin-bottom:8px; padding-right:2px; letter-spacing:.01em;
}
.dash-section-title .bar{ width:3px; height:14px; border-radius:2px; background:var(--accent); display:inline-block; }

@media (max-width: 900px){
  .dash-hero{ grid-template-columns:repeat(2,1fr); }
  .kpis{ grid-template-columns:repeat(2,1fr); }
}

/* ---------- table / database grid ---------- */
.panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; position:relative; }
.panel::before{ content:""; display:block; height:2px; background:linear-gradient(90deg,var(--accent),var(--gold)); opacity:.75; }
.chart-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
.panel-head h2{ font-size:15.5px; margin:0; }
.tablewrap{ overflow-x:auto; }
table.db{ width:100%; border-collapse:collapse; min-width:920px; }
table.db th{ text-align:right; font-size:11.5px; color:var(--ink-faint); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none; }
table.db th:hover{ color:var(--ink); }
table.db td{ padding:11px 14px; border-bottom:1px solid var(--border); font-size:13.5px; white-space:nowrap; }
table.db tbody tr{ cursor:pointer; transition:background .1s; }
table.db tbody tr:hover{ background:var(--surface-2); }
table.db tbody tr:last-child td{ border-bottom:none; }
.tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
.tag-income{ background:var(--accent-soft); color:var(--accent-soft-ink); }
.tag-dev{ background:var(--gold-soft); color:var(--gold); }
.tag-land{ background:var(--surface-3); color:var(--ink-soft); }
.dot{ width:9px;height:9px;border-radius:50%; display:inline-block; }
.verdict-good{ background:var(--good-soft); color:var(--good); }
.verdict-warn{ background:var(--warn-soft); color:var(--warn); }
.verdict-bad{ background:var(--bad-soft); color:var(--bad); }
.empty{ padding:64px 20px; text-align:center; color:var(--ink-faint); }
.empty .display{ font-size:20px; color:var(--ink); margin-bottom:6px; }

/* ---------- modal / wizard ---------- */
.overlay{ position:fixed; inset:0; background:rgba(10,14,10,.5); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
.modal{ background:var(--surface); border-radius:16px; width:100%; max-width:880px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 24px 64px -20px rgba(0,0,0,.4); border:1px solid var(--border); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
.modal-head .steps{ font-size:11.5px; color:var(--ink-faint); font-family:Aptos,'Segoe UI',Arial,sans-serif; direction:ltr; font-variant-numeric:tabular-nums; unicode-bidi:isolate; }
.progress{ height:4px; background:var(--surface-3); }
.progress i{ display:block; height:100%; background:var(--accent); transition:width .25s; }
.modal-body{ padding:24px 26px; overflow-y:auto; flex:1; }
.modal-foot{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-top:1px solid var(--border); gap:10px; }
.step-title{ font-size:17px; font-weight:700; margin:0 0 3px; }
.step-sub{ font-size:12.5px; color:var(--ink-faint); margin:0 0 20px; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
@media (max-width:720px){ .grid2,.grid3{ grid-template-columns:1fr; } .kpis{grid-template-columns:1fr 1fr;} }

.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:2px; }
.field.span2{ grid-column:1 / -1; }
.field label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:flex; justify-content:space-between; gap:8px; }
.field label .en{ direction:ltr; color:var(--ink-faint); font-weight:500; font-size:11px; }
.field input, .field select, .field textarea{
  border:1px solid var(--border); background:var(--paper); color:var(--ink); border-radius:8px;
  padding:9px 11px; font-size:13.5px; font-family:inherit; width:100%;
}
.field input[type=number]{ direction:ltr; text-align:left; unicode-bidi:isolate; font-family:Aptos,'Segoe UI',Arial,sans-serif; font-variant-numeric:tabular-nums; }
.field .hint{ font-size:11px; color:var(--ink-faint); }
.field textarea{ resize:vertical; min-height:64px; font-family:inherit; }
.suffix-wrap{ position:relative; }
.suffix-wrap .suffix{ position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:11.5px; color:var(--ink-faint); pointer-events:none; }
.suffix-wrap input{ padding-left:44px; }

.chooser{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.chooser .opt{ border:1.5px solid var(--border); border-radius:11px; padding:14px; cursor:pointer; text-align:center; transition:border-color .1s, background .1s; }
.chooser .opt:hover{ border-color:var(--accent); }
.chooser .opt.sel{ border-color:var(--accent); background:var(--accent-soft); }
.chooser .opt .ic{ font-size:22px; margin-bottom:6px; }
.chooser .opt .t{ font-weight:700; font-size:13.5px; }
.chooser .opt .d{ font-size:11px; color:var(--ink-faint); margin-top:3px; }

.livebox{ margin-top:20px; border:1px dashed var(--border); border-radius:10px; padding:12px 14px; background:var(--surface-2); }
.livebox .lt{ font-size:11px; font-weight:700; color:var(--ink-faint); margin-bottom:8px; }
.livebox .lg{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.livebox .li{ font-size:11.5px; }
.livebox .li b{ display:block; font-size:14px; font-family:Aptos,'Segoe UI',Arial,sans-serif; direction:ltr; text-align:right; font-variant-numeric:tabular-nums; unicode-bidi:isolate; }

/* ---------- detail / memo view ---------- */
.memo{ display:flex; flex-direction:column; gap:16px; }
.memo-hero{ background:linear-gradient(160deg,var(--surface-2),var(--surface)); border:1px solid var(--border); border-radius:16px; padding:24px 26px; }
.memo-hero .eyebrow{ font-size:11.5px; font-weight:700; color:var(--accent); letter-spacing:.03em; }
.memo-hero h2{ font-size:24px; margin:6px 0 4px; }
.memo-hero .meta{ font-size:12.5px; color:var(--ink-faint); display:flex; gap:14px; flex-wrap:wrap; }
.verdict-banner{ margin-top:16px; border-radius:10px; padding:13px 16px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px; }
.section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
.section h3{ font-size:14.5px; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
.section h3 .n{ background:var(--accent-soft); color:var(--accent-soft-ink); width:22px;height:22px;border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; font-family:Aptos,'Segoe UI',Arial,sans-serif; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }
.kv{ display:grid; grid-template-columns:1fr auto; gap:8px 16px; font-size:13px; }
.kv .k{ color:var(--ink-soft); }
.kv .v{ font-family:Aptos,'Segoe UI',Arial,sans-serif; direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums; text-align:right; font-weight:600; }
table.report{ width:100%; border-collapse:collapse; font-size:13px; }
table.report th{ text-align:right; font-size:11px; color:var(--ink-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); }
table.report td{ padding:9px 10px; border-bottom:1px solid var(--border); }
table.report td.num{ font-family:Aptos,'Segoe UI',Arial,sans-serif; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }
table.report tr:last-child td{ border-bottom:none; }
.pill{ padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; }
.grid-2col{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; }
@media (max-width:900px){ .grid-2col{ grid-template-columns:1fr; } }
.bars{ display:flex; flex-direction:column; gap:10px; }
.barrow .lbl{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px; }
.barrow .track{ height:9px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
.barrow .fill{ height:100%; border-radius:5px; }
.note{ font-size:11.5px; color:var(--ink-faint); line-height:1.7; }
.badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
.small-btns{ display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- جرس النشاط الحديث (فرص أضافها الزملاء) ---------- */
.activity-bell-wrap{ position:relative; display:inline-block; }
.activity-bell-btn{ position:relative; }
.activity-badge{
  position:absolute; top:-6px; left:-6px; background:var(--bad); color:#fff; font-size:10px; font-weight:700;
  min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;
}
.activity-dropdown{
  position:absolute; top:calc(100% + 8px); left:0; width:320px; max-height:380px; overflow-y:auto;
  background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.22);
  z-index:60; padding:10px;
}
.activity-item{ display:flex; flex-direction:column; gap:2px; padding:8px 9px; border-radius:8px; cursor:pointer; }
.activity-item:hover{ background:var(--surface-2); }
.activity-item.unseen{ background:var(--gold-soft, var(--surface-2)); }
.activity-item .t{ font-size:12.5px; font-weight:600; }
.activity-item .m{ font-size:11px; color:var(--ink-faint); }

/* ---------- closing conditions list ---------- */
.cond-list{ display:flex; flex-direction:column; gap:8px; }
.cond-row{ display:flex; gap:8px; align-items:center; }
.cond-row input[type=text]{ flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; direction:rtl; unicode-bidi:plaintext; }
.cond-row select{ min-width:150px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:12.5px; }
table.db thead th:first-child, table.db tbody td:first-child{ width:32px; text-align:center; }

/* ---------- print / PDF export (letterhead-style report) ---------- */
@page{ size:A4 portrait; margin: 22mm 16mm 20mm; }
@page wide-report{ size:A4 landscape; margin: 14mm 12mm 16mm; }
/* غلاف/ترويسة الطباعة (شعار الشركة + اسمها) — عنصر DOM حقيقي، مخفي على الشاشة، يظهر فقط عند الطباعة */
.print-letterhead{ display:none; }
.print-run-header{ display:none; }
@media print{
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
  .topbar, .kpis.portfolio, .dash-hero, .dash-section, .panel, .badge-row, .small-btns, .overlay, .db-toolbar, .opal-footer, button{ display:none !important; }
  html,body{ background:#fff; color:#1B1D22; font-family:'Sakkal Majalla','Segoe UI',Arial,sans-serif; font-size:12px; line-height:1.5; }
  html[lang="en"], html[lang="en"] body{ font-family:Aptos,'Segoe UI',Arial,sans-serif; }
  .app{ padding:0; max-width:none; }
  .memo{ gap:0; }
  .memo, .print-section, .section{ page-break-inside:avoid; break-inside:avoid; }
  .memo-hero, .print-letterhead, .section h3{ page-break-after:avoid; break-after:avoid; }
  .print-section + .print-section{ page-break-before:auto; }
  /* أرقام/نصوص إنجليزية داخل التقرير المطبوع تبقى بخط لاتيني احترافي واضح، بدل الاعتماد على خط عربي لعرض أرقام */
  .mono, .ltr, table.report td.num, .kv .v[dir=ltr], .num{ font-family:Aptos,'Segoe UI',Arial,sans-serif !important; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }

  /* شريط علوي متكرر في كل صفحة (اسم الشركة + عنوان التقرير) — position:fixed يتكرر تلقائياً بمعظم المتصفحات عند الطباعة */
  .print-run-header{
    display:flex; align-items:center; justify-content:space-between; position:fixed; top:0; left:0; right:0;
    font-size:8.5px; color:#9195A0; border-bottom:.5px solid #E3E1DA; padding-bottom:3px;
  }

  /* letterhead (شعار + اسم الشركة، عنصر DOM حتى تُعرض صورة الشعار فعلياً) — غلاف التقرير، صفحة أولى فقط */
  .print-letterhead{
    display:flex; align-items:center; justify-content:center; gap:14px;
    border-bottom:3px solid #1F5F6B; padding-bottom:14px; margin-bottom:18px;
  }
  .print-letterhead-logo{ height:42px; max-width:130px; object-fit:contain; }
  .print-letterhead-text{ text-align:center; }
  .print-letterhead-company{ font-size:14.5px; font-weight:700; color:#1B1D22; margin-bottom:3px; letter-spacing:.01em; }
  .print-letterhead-app{ font-family:'Sakkal Majalla','Segoe UI',Arial,sans-serif; font-size:11px; letter-spacing:.07em; color:#1F5F6B; font-weight:700; }
  .print-letterhead-date{ font-size:9.5px; color:#565A63; margin-top:3px; }

  .memo-hero{
    border:none; border-bottom:2px solid #1F5F6B; background:linear-gradient(180deg,#F2F7F8,transparent);
    border-radius:0; padding:12px 4px 16px; margin-bottom:18px; break-after:avoid;
  }
  .memo-hero h2{ font-size:23px; margin:8px 0 6px; color:#1B1D22; font-weight:800; }
  .memo-hero .eyebrow{ color:#1F5F6B; font-weight:800; }
  .memo-hero .meta{ color:#565A63; }
  .verdict-banner{ border:1px solid rgba(0,0,0,.15) !important; font-weight:700; }

  .section{
    border:1px solid #DCDAD3; border-radius:6px; page-break-inside:avoid; break-inside:avoid; margin-bottom:13px;
    box-shadow:none;
  }
  .section h3{
    background:linear-gradient(90deg,#F2F7F8,#fff); border-inline-start:3.5px solid #1F5F6B;
    border-radius:6px 6px 0 0; padding-inline-start:12px !important; font-weight:800; letter-spacing:.01em;
  }
  .kpis{ break-inside:avoid; grid-template-columns:repeat(3,1fr) !important; gap:9px; }
  .kpi{ border:1px solid #E3E6DE; border-inline-start-width:3px; padding:10px 12px; box-shadow:none; }
  .kpi .l{ font-size:10px; }
  .kpi .v{ font-size:18px; }
  table.report, table.db{ page-break-inside:auto; break-inside:auto; width:100% !important; min-width:0 !important; }
  table.report thead, table.db thead{ display:table-header-group; }
  table.report tr, table.db tr{ page-break-inside:avoid; break-inside:avoid; }
  table.report th, table.db th{ background:#F2F7F8 !important; border-bottom:1.5px solid #1F5F6B !important; }
  table.report tbody tr:nth-child(even) td, table.db tbody tr:nth-child(even) td{ background:#FAFAF8; }
  canvas{ break-inside:avoid; max-height:200px !important; }
  .tag, .verdict-good, .verdict-warn, .verdict-bad{ border:.5px solid rgba(0,0,0,.12); }

  /* footer disclaimer + العلامة التجارية */
  .memo::after{
    content: "أوبال القابضة — منصة ذكاء الاستثمار العقاري — أرقام تقديرية لأغراض دراسة الجدوى الأولية وليست عرضاً ملزماً. Opal Holding — Opal Real Estate Intelligence — figures are estimates for preliminary feasibility study purposes only and do not constitute a binding offer.";
    display:block; text-align:center; font-size:9px; color:#888C95; margin-top:20px;
    border-top:1px solid #DCDAD3; padding-top:9px;
  }
  a[href]:after{ content:""; }
}
